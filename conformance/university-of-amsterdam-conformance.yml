- standard: lti
  status: implemented-in-code-not-in-contract
  x-operator: institution
  detail: >-
    The institution's own GitHub organisation publishes LTI 1.3 code it wrote and
    maintains: a consumer middleware library and an LTI app that provisions
    Teams for courses in an LMS. This is genuine institutional LTI engineering,
    but it is source code, not a served contract, so it does not satisfy a
    conformance check that reads from the API description.
  evidence:
