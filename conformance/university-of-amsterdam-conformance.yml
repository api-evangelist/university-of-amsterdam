- standard: crossref
  reason: >-
    No Crossref member record found for the University of Amsterdam; research
    output DOIs run through DataCite. Amsterdam University Press is a separate
    Crossref member and is not the university.
- standard: orcid
  reason: >-
    No ORCID integration exposed on a machine-readable institution-operated
    surface. Author identifiers appear inside the Pure tenant's records rather
    than on a contract the institution serves.
