openapi: 3.2.0
info:
  title: LiteLLM Usage AI API
  description: 'Enterprise Edition


    Proxy Server to call 100+ LLMs in the OpenAI format. **Customize Swagger Docs**


    👉 ```LiteLLM Admin Panel on /ui```. Create, Edit Keys with SSO. Having issues? Try ```Fallback Login```


    💸 ```LiteLLM Model Cost Map```.


    🔎 ```LiteLLM Model Hub```. See available models on the proxy. **Docs**'
  version: 1.95.0
tags:
- name: usage_ai
paths:
  /usage/ai/chat:
    post:
      description: 'AI chat about usage data. Streams SSE events with the AI response.

        The AI agent has access to tools that query aggregated daily activity data.'
      operationId: usage_ai_chat_usage_ai_chat_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsageAIChatRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - APIKeyHeader: []
      summary: Usage Ai Chat
      tags:
      - usage_ai
components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ChatMessage:
      properties:
        content:
          title: Content
          type: string
        role:
          enum:
          - user
          - assistant
          title: Role
          type: string
      required:
      - role
      - content
      title: ChatMessage
      type: object
    UsageAIChatRequest:
      properties:
        messages:
          description: Chat messages (user/assistant history)
          items:
            $ref: '#/components/schemas/ChatMessage'
          title: Messages
          type: array
        model:
          anyOf:
          - type: string
          - type: 'null'
          description: Model to use for AI chat
          title: Model
      required:
      - messages
      title: UsageAIChatRequest
      type: object
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
  securitySchemes:
    APIKeyHeader:
      type: apiKey
      description: Bearer token
      in: header
      name: x-litellm-api-key
