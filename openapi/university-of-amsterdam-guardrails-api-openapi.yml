            format: date-time
          - type: 'null'
          title: Created At
        updated_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Updated At
        guardrail_definition_location:
          $ref: '#/components/schemas/GUARDRAIL_DEFINITION_LOCATION'
          default: config
      type: object
      required:
      - guardrail_name
      title: GuardrailInfoResponse
    CiscoAIDefenseRule:
      properties:
