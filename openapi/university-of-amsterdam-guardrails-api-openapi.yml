              $ref: '#/components/schemas/PiiEntityType'
            type: array
          - type: 'null'
          title: Entities
        input_type:
          type: string
          title: Input Type
          default: request
        messages:
          anyOf:
          - items:
              additionalProperties: true
              type: object
            type: array
          - type: 'null'
          title: Messages
        metadata:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Metadata
      type: object
      required:
      - guardrail_name
      - text
      title: ApplyGuardrailRequest
    BedrockChecksContentFilterModel:
      properties:
        categories:
          items:
            $ref: '#/components/schemas/BedrockChecksContentFilterCategoryItem'
          type: array
          title: Categories
      type: object
      required:
      - categories
      title: BedrockChecksContentFilterModel
    UsageLogsResponse:
      properties:
        logs:
          items:
            $ref: '#/components/schemas/UsageLogEntry'
          type: array
          title: Logs
        total:
          type: integer
          title: Total
        page:
          type: integer
          title: Page
        page_size:
          type: integer
          title: Page Size
      type: object
      required:
