openapi: 3.2.0
info:
  title: LiteLLM Rag API
  description: 'Enterprise Edition


    Proxy Server to call 100+ LLMs in the OpenAI format. **Customize Swagger Docs**


    👉 ```LiteLLM Admin Panel on /ui```. Create, Edit Keys with SSO. Having issues? Try ```Fallback Login```


    💸 ```LiteLLM Model Cost Map```.


    🔎 ```LiteLLM Model Hub```. See available models on the proxy. **Docs**'
  version: 1.95.0
tags:
- name: Rag
paths:
  /rag/ingest:
    post:
      tags:
      - Rag
      summary: Rag Ingest
      description: 'RAG Ingest endpoint - all-in-one document ingestion pipeline.


        Supports form upload (for files) or JSON body (for URLs).


        ## Form upload (for files):

        ```bash

        curl -X POST "http://localhost:4000/v1/rag/ingest" \

        -H "Authorization: Bearer sk-1234" \

        -F file="@document.pdf" \

        -F ''ingest_options={"vector_store": {"custom_llm_provider": "openai"}}''

        ```


        ## JSON body (for URLs):

        ```bash

        curl -X POST "http://localhost:4000/v1/rag/ingest" \

        -H "Authorization: Bearer sk-1234" \

        -H "Content-Type: application/json" \

        -d ''{

        "file_url": "https://example.com/document.pdf",

        "ingest_options": {"vector_store": {"custom_llm_provider": "openai"}}

        }''

        ```


        ## Bedrock:

        ```bash

        curl -X POST "http://localhost:4000/v1/rag/ingest" \

        -H "Authorization: Bearer sk-1234" \

        -F file="@document.pdf" \

        -F ''ingest_options={"vector_store": {"custom_llm_provider": "bedrock"}}''

        ```'
      operationId: rag_ingest_rag_ingest_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - APIKeyHeader: []
