openapi: 3.2.0
info:
  title: LiteLLM Files API
  description: 'Enterprise Edition


    Proxy Server to call 100+ LLMs in the OpenAI format. **Customize Swagger Docs**


    👉 ```LiteLLM Admin Panel on /ui```. Create, Edit Keys with SSO. Having issues? Try ```Fallback Login```


    💸 ```LiteLLM Model Cost Map```.


    🔎 ```LiteLLM Model Hub```. See available models on the proxy. **Docs**'
  version: 1.95.0
tags:
- name: Files
paths:
  /files:
    post:
      tags:
      - Files
      summary: Create File
      description: 'Upload a file that can be used across - Assistants API, Batch API

        This is the equivalent of POST https://api.openai.com/v1/files


        Supports Identical Params as: https://platform.openai.com/docs/api-reference/files/create


        Example Curl

        ```

        curl http://localhost:4000/v1/files -H "Authorization: Bearer sk-1234" -F purpose="batch" -F file="@mydata.jsonl"

        -F expires_after[anchor]="created_at" -F expires_after[seconds]=2592000

        ```'
      operationId: create_file_files_post
      security:
      - APIKeyHeader: []
      parameters:
      - name: provider
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Provider
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_create_file_files_post'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - Files
      summary: List Files
      description: 'Returns information about a specific file. that can be used across - Assistants API, Batch API

        This is the equivalent of GET https://api.openai.com/v1/files/


        Supports Identical Params as: https://platform.openai.com/docs/api-reference/files/list


        Example Curl

        ```

        curl http://localhost:4000/v1/files -H "Authorization: Bearer sk-1234"


        ```'
      operationId: list_files_files_get
      security:
      - APIKeyHeader: []
      parameters:
      - name: provider
        in: query
        required: false
        schema:
          anyOf:
          - type: string
