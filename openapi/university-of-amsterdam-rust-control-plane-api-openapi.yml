openapi: 3.2.0
info:
  title: LiteLLM rust control plane API
  description: 'Enterprise Edition


    Proxy Server to call 100+ LLMs in the OpenAI format. **Customize Swagger Docs**


    👉 ```LiteLLM Admin Panel on /ui```. Create, Edit Keys with SSO. Having issues? Try ```Fallback Login```


    💸 ```LiteLLM Model Cost Map```.


    🔎 ```LiteLLM Model Hub```. See available models on the proxy. **Docs**'
  version: 1.95.0
tags:
- name: rust control plane
paths:
  /v1/rust_control_plane/logs:
    post:
      tags:
      - rust control plane
      summary: Ingest Callback Logs
      description: 'Replay a batch of finished logging payloads through the callback fan-out.


        Admin-only: the payloads write spend logs and trigger every callback, so this

        is a trusted internal route, not a public surface.'
      operationId: ingest_callback_logs_v1_rust_control_plane_logs_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CallbackLogsRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallbackLogsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - APIKeyHeader: []
components:
  schemas:
    CallbackLogFailure:
      properties:
        index:
          type: integer
          title: Index
        error:
          type: string
          title: Error
      type: object
      required:
      - index
      - error
      title: CallbackLogFailure
      description: A record that failed to replay, identified by its index in the batch.
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    CallbackLogsResponse:
      properties:
        processed:
          type: integer
          title: Processed
        failed:
          type: integer
          title: Failed
        failures:
          items:
            $ref: '#/components/schemas/CallbackLogFailure'
          type: array
          title: Failures
      type: object
      required:
      - processed
      - failed
      title: CallbackLogsResponse
      description: 'Per-batch result: counts plus per-record failure detail so the caller can

        distinguish a transient callback error from a structurally bad payload.'
    CallbackLogsRequest:
      properties:
        records:
          items:
            $ref: '#/components/schemas/CallbackLogRecord'
          type: array
          maxItems: 1000
          title: Records
      type: object
      required:
      - records
      title: CallbackLogsRequest
      description: A batch of logging events posted by an external producer.
    CallbackLogRecord:
      properties:
        status:
          type: string
          enum:
          - success
          - failure
          title: Status
        standard_logging_payload:
          additionalProperties: true
          type: object
          title: Standard Logging Payload
        error:
          anyOf:
          - type: string
          - type: 'null'
          title: Error
      type: object
      required:
      - status
      - standard_logging_payload
      title: CallbackLogRecord
      description: A single finished logging event to replay through the callbacks.
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
  securitySchemes:
    APIKeyHeader:
      type: apiKey
      description: Bearer token
      in: header
      name: x-litellm-api-key
