openapi: 3.2.0
info:
  title: LiteLLM Batch API
  description: 'Enterprise Edition


    Proxy Server to call 100+ LLMs in the OpenAI format. **Customize Swagger Docs**


    👉 ```LiteLLM Admin Panel on /ui```. Create, Edit Keys with SSO. Having issues? Try ```Fallback Login```


    💸 ```LiteLLM Model Cost Map```.


    🔎 ```LiteLLM Model Hub```. See available models on the proxy. **Docs**'
  version: 1.95.0
tags:
- name: Batch
paths:
  /batches:
    post:
      tags:
      - Batch
      summary: Create Batch
      description: 'Create large batches of API requests for asynchronous processing.

        This is the equivalent of POST https://api.openai.com/v1/batch

        Supports Identical Params as: https://platform.openai.com/docs/api-reference/batch


        Example Curl

        ```

        curl http://localhost:4000/v1/batches -H "Authorization: Bearer sk-1234" -H "Content-Type: application/json" -d ''{

        "input_file_id": "file-abc123",

        "endpoint": "/v1/chat/completions",

        "completion_window": "24h"

        }''

        ```'
      operationId: create_batch_batches_post
      security:
      - APIKeyHeader: []
      parameters:
      - name: provider
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Provider
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - Batch
      summary: List Batches
      description: 'Lists

        This is the equivalent of GET https://api.openai.com/v1/batches/

        Supports Identical Params as: https://platform.openai.com/docs/api-reference/batch/list


        Example Curl

        ```

        curl http://localhost:4000/v1/batches?limit=2 -H "Authorization: Bearer sk-1234" -H "Content-Type: application/json"

        ```'
      operationId: list_batches_batches_get
      security:
      - APIKeyHeader: []
      parameters:
      - name: provider
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Provider
      - name: limit
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Limit
      - name: after
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: After
      - name: target_model_names
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Target Model Names
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
