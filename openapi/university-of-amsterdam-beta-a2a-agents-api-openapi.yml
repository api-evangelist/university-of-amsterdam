openapi: 3.2.0
info:
  title: LiteLLM [beta] A2A Agents API
  description: 'Enterprise Edition


    Proxy Server to call 100+ LLMs in the OpenAI format. **Customize Swagger Docs**


    👉 ```LiteLLM Admin Panel on /ui```. Create, Edit Keys with SSO. Having issues? Try ```Fallback Login```


    💸 ```LiteLLM Model Cost Map```.


    🔎 ```LiteLLM Model Hub```. See available models on the proxy. **Docs**'
  version: 1.95.0
tags:
- name: '[beta] A2A Agents'
paths:
  /v1/agents:
    get:
      tags:
      - '[beta] A2A Agents'
      summary: Get Agents
      description: 'Example usage:

        ```

        curl -X GET "http://localhost:4000/v1/agents" -H "Content-Type: application/json" -H "Authorization: Bearer your-key" ```


        Pass `?health_check=true` to filter out agents whose URL is unreachable:

        ```

        curl -X GET "http://localhost:4000/v1/agents?health_check=true" -H "Content-Type: application/json" -H "Authorization: Bearer your-key" ```


        Returns: List[AgentResponse]'
      operationId: get_agents_v1_agents_get
      security:
      - APIKeyHeader: []
      parameters:
      - name: health_check
        in: query
        required: false
        schema:
          type: boolean
          description: When true, performs a GET request to each agent's URL. Agents with reachable URLs (HTTP status < 500) and agents without a URL are returned; unreachable agents are filtered out.
          default: false
          title: Health Check
        description: When true, performs a GET request to each agent's URL. Agents with reachable URLs (HTTP status < 500) and agents without a URL are returned; unreachable agents are filtered out.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AgentResponse'
                title: Response Get Agents V1 Agents Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - '[beta] A2A Agents'
      summary: Create Agent
      description: 'Create a new agent


        Example Request:

        ```bash

        curl -X POST "http://localhost:4000/v1/agents" \

        -H "Authorization: Bearer " \

        -H "Content-Type: application/json" \

        -d ''{

        "agent_name": "my-custom-agent",

        "agent_card_params": {

        "protocolVersion": "1.0",

        "name": "Hello World Agent",

        "description": "Just a hello world agent",

        "url": "http://localhost:9999/",

        "version": "1.0.0",

        "defaultInputModes": ["text"],

        "defaultOutputModes": ["text"],

        "capabilities": {

        "streaming": true

        },

        "skills": [

        {

        "id": "hello_world",

        "name": "Returns hello world",

        "description": "just returns hello world",

        "tags": ["hello world"],

        "examples": ["hi", "hello world"]

        }

        ]

        },

        "litellm_params": {

        "make_public": true

        }

        }''

        ```'
      operationId: create_agent_v1_agents_post
      security:
      - APIKeyHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentConfig'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/agents/{agent_id}:
    get:
      tags:
      - '[beta] A2A Agents'
      summary: Get Agent By Id
      description: 'Get a specific agent by ID


        Example Request:

        ```bash

        curl -X GET "http://localhost:4000/v1/agents/123e4567-e89b-12d3-a456-426614174000" \

        -H "Authorization: Bearer "

        ```'
      operationId: get_agent_by_id_v1_agents__agent_id__get
      security:
      - APIKeyHeader: []
      parameters:
      - name: agent_id
        in: path
        required: true
        schema:
          type: string
          title: Agent Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - '[beta] A2A Agents'
      summary: Update Agent
      description: 'Update an existing agent


        Example Request:

        ```bash

        curl -X PUT "http://localhost:4000/v1/agents/123e4567-e89b-12d3-a456-426614174000" \

        -H "Authorization: Bearer " \

        -H "Content-Type: application/json" \

        -d ''{

        "agent_name": "updated-agent",

        "agent_card_params": {

        "protocolVersion": "1.0",

        "name": "Updated Agent",

        "description": "Updated description",

        "url": "http://localhost:9999/",

        "version": "1.1.0",

        "defaultInputModes": ["text"],

        "defaultOutputModes": ["text"],

        "capabilities": {

        "streaming": true

        },

        "skills": []

        },

        "litellm_params": {

        "make_public": false

        }

        }''

        ```'
      operationId: update_agent_v1_agents__agent_id__put
      security:
      - APIKeyHeader: []
      parameters:
      - name: agent_id
        in: path
        required: true
        schema:
          type: string
          title: Agent Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentConfig'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - '[beta] A2A Agents'
      summary: Patch Agent
      description: 'Update an existing agent


        Example Request:

        ```bash

        curl -X PATCH "http://localhost:4000/v1/agents/123e4567-e89b-12d3-a456-426614174000" \

        -H "Authorization: Bearer " \

        -H "Content-Type: application/json" \

        -d ''{

        "agent_name": "updated-agent",

        "agent_card_params": {

        "protocolVersion": "1.0",

        "name": "Updated Agent",

        "description": "Updated description",

        "url": "http://localhost:9999/",

        "version": "1.1.0",

        "defaultInputModes": ["text"],

        "defaultOutputModes": ["text"],

        "capabilities": {

        "streaming": true

        },

        "skills": []

        },

        "litellm_params": {

        "make_public": false

        }

        }''

        ```'
      operationId: patch_agent_v1_agents__agent_id__patch
      security:
      - APIKeyHeader: []
      parameters:
      - name: agent_id
        in: path
        required: true
        schema:
          type: string
          title: Agent Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchAgentRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/agents/{agent_id}/make_public:
    post:
      tags:
      - '[beta] A2A Agents'
      summary: Make Agent Public
      description: 'Make an agent publicly discoverable


        Example Request:

        ```bash

        curl -X POST "http://localhost:4000/v1/agents/123e4567-e89b-12d3-a456-426614174000/make_public" \

        -H "Authorization: Bearer " \

        -H "Content-Type: application/json"

        ```


        Example Response:

        ```json

        {

        "agent_id": "123e4567-e89b-12d3-a456-426614174000",

        "agent_name": "my-custom-agent",

        "litellm_params": {

        "make_public": true

        },

        "agent_card_params": {...},

        "created_at": "2025-11-15T10:30:00Z",

        "updated_at": "2025-11-15T10:35:00Z",

        "created_by": "user123",

        "updated_by": "user123"

        }

        ```'
      operationId: make_agent_public_v1_agents__agent_id__make_public_post
      security:
      - APIKeyHeader: []
      parameters:
      - name: agent_id
        in: path
        required: true
        schema:
          type: string
          title: Agent Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentMakePublicResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/agents/make_public:
    post:
      tags:
      - '[beta] A2A Agents'
      summary: Make Agents Public
      description: 'Make multiple agents publicly discoverable


        Example Request:

        ```bash

        curl -X POST "http://localhost:4000/v1/agents/make_public" \

        -H "Authorization: Bearer " \

        -H "Content-Type: application/json" \

        -d ''{

        "agent_ids": ["123e4567-e89b-12d3-a456-426614174000", "123e4567-e89b-12d3-a456-426614174001"]

        }''

        ```


        Example Response:

        ```json

        {

        "agent_id": "123e4567-e89b-12d3-a456-426614174000",

        "agent_name": "my-custom-agent",

        "litellm_params": {

        "make_public": true

        },

        "agent_card_params": {...},

        "created_at": "2025-11-15T10:30:00Z",

        "updated_at": "2025-11-15T10:35:00Z",

        "created_by": "user123",

        "updated_by": "user123"

        }

        ```'
      operationId: make_agents_public_v1_agents_make_public_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MakeAgentsPublicRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentMakePublicResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - APIKeyHeader: []
