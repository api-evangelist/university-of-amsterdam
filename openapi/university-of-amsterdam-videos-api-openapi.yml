openapi: 3.2.0
info:
  title: LiteLLM Videos API
  description: "Enterprise Edition \n\nProxy Server to call 100+ LLMs in the OpenAI format. [**Customize Swagger Docs**](https://docs.litellm.ai/docs/proxy/enterprise#swagger-docs---custom-routes--branding)\n\n\U0001F449 [```LiteLLM Admin Panel on /ui```](/ui). Create, Edit Keys with SSO. Having issues? Try [```Fallback Login```](/fallback/login)\n\n\U0001F4B8 [```LiteLLM Model Cost Map```](https://models.litellm.ai/).\n\n\U0001F50E [```LiteLLM Model Hub```](/ui/model_hub_table). See available models on the proxy. [**Docs**](https://docs.litellm.ai/docs/proxy/ai_hub)"
  version: 1.95.0
  x-operator: institution
  x-provenance:
    method: probed
    source: https://llmproxy.uva.nl/openapi.json
    retrieved: '2026-08-19'
    note: Document is generated by the LiteLLM proxy software the University of Amsterdam self-hosts; the deployment, the key issuance and the host (llmproxy.uva.nl, UvA Azure) are the institution's. servers[] added by API Evangelist because the served document omits it; nothing else altered.
servers:
- url: https://llmproxy.uva.nl
  description: University of Amsterdam / Amsterdam University of Applied Sciences shared AI gateway
tags:
- name: videos
paths:
  /videos:
    get:
      tags:
      - videos
      summary: Video List
      description: 'Video list endpoint for retrieving a list of videos.


        Follows the OpenAI Videos API spec:

        https://platform.openai.com/docs/api-reference/videos


        Example:

        ```bash

        curl -X GET "http://localhost:4000/v1/videos"         -H "Authorization: Bearer sk-1234"

        ```'
      operationId: video_list_videos_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - APIKeyHeader: []
    post:
      tags:
      - videos
      summary: Video Generation
      description: "Video generation endpoint for creating videos from text prompts.\n\nFollows the OpenAI Videos API spec:\nhttps://platform.openai.com/docs/api-reference/videos\n\nExample:\n```bash\ncurl -X POST \"http://localhost:4000/v1/videos\"         -H \"Authorization: Bearer sk-1234\"         -H \"Content-Type: application/json\"         -d '{\n        \"model\": \"sora-2\",\n        \"prompt\": \"A beautiful sunset over the ocean\"\n    }'\n```"
      operationId: video_generation_videos_post
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_video_generation_videos_post'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - APIKeyHeader: []
  /v1/videos:
    get:
      tags:
      - videos
      summary: Video List
      description: 'Video list endpoint for retrieving a list of videos.


        Follows the OpenAI Videos API spec:

        https://platform.openai.com/docs/api-reference/videos


        Example:

        ```bash

        curl -X GET "http://localhost:4000/v1/videos"         -H "Authorization: Bearer sk-1234"

        ```'
      operationId: video_list_v1_videos_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - APIKeyHeader: []
