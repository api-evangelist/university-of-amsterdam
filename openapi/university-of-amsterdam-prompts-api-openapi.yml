openapi: 3.2.0
info:
  title: LiteLLM Prompts API
  description: 'Enterprise Edition


    Proxy Server to call 100+ LLMs in the OpenAI format. **Customize Swagger Docs**


    👉 ```LiteLLM Admin Panel on /ui```. Create, Edit Keys with SSO. Having issues? Try ```Fallback Login```


    💸 ```LiteLLM Model Cost Map```.


    🔎 ```LiteLLM Model Hub```. See available models on the proxy. **Docs**'
  version: 1.95.0
tags:
- name: Prompts
paths:
  /utils/dotprompt_json_converter:
    post:
      tags:
      - Prompts
      summary: Convert Prompt File To Json
      description: 'Convert a .prompt file to JSON format.


        This endpoint accepts a .prompt file upload and returns the equivalent JSON representation

        that can be stored in a database or used programmatically.


        Returns the JSON structure with ''content'' and ''metadata'' fields.'
      operationId: convert_prompt_file_to_json_utils_dotprompt_json_converter_post
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_convert_prompt_file_to_json_utils_dotprompt_json_converter_post'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Convert Prompt File To Json Utils Dotprompt Json Converter Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - APIKeyHeader: []
components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    Body_convert_prompt_file_to_json_utils_dotprompt_json_converter_post:
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          title: File
      type: object
      required:
      - file
      title: Body_convert_prompt_file_to_json_utils_dotprompt_json_converter_post
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
  securitySchemes:
    APIKeyHeader:
      type: apiKey
      description: Bearer token
      in: header
      name: x-litellm-api-key
