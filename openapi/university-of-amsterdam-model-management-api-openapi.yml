  /v2/model/info:
    get:
      tags:
      - Model Management
      summary: Model Info V2
      description: 'Paginated model metadata for proxy deployments (pricing, provider, team access).


        Returns configured router deployments with enriched `model_info` (costs, provider,

        context window, etc.). Sensitive fields such as API keys and api_base are omitted.


        Query parameters:

        model: Filter to a single public `model_name`.

        user_models_only: When true, only return models created by the calling user.

        include_team_models: When true, populate `access_via_team_ids` and `direct_access`

        on each model and filter to deployments the caller can use.

        page / size: Pagination controls (defaults: page=1, size=50).

        search: Case-insensitive partial match on model name or team public name.

        modelId: Return a single deployment by LiteLLM model id.

        teamId: Filter to models with direct access or team membership for this team id.

        sortBy / sortOrder: Sort by model_name, created_at, updated_at, costs, or status.


        Example request:

        ```

        curl -X GET ''http://localhost:4000/v2/model/info?include_team_models=true&page=1&size=50'' \

        --header ''Authorization: Bearer sk-1234''

        ```


        Example response:

        ```json

        {

        "data": [

        {

        "model_name": "gpt-4",

        "litellm_params": {"model": "openai/gpt-4.1"},

        "model_info": {

        "id": "abc123",

        "litellm_provider": "openai",

        "access_via_team_ids": ["team-1"],

        "direct_access": true

        }

        }

        ],

        "total_count": 1,

        "current_page": 1,

        "total_pages": 1,

        "size": 50

        }

        ```'
      operationId: model_info_v2_v2_model_info_get
      security:
      - APIKeyHeader: []
      parameters:
      - name: model
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Specify the model name (optional)
          title: Model
        description: Specify the model name (optional)
      - name: user_models_only
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          description: Only return models added by this user
          default: false
          title: User Models Only
        description: Only return models added by this user
      - name: include_team_models
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          description: Return all models across all teams user is in.
          default: false
          title: Include Team Models
        description: Return all models across all teams user is in.
      - name: debug
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          default: false
          title: Debug
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          description: Page number
          default: 1
          title: Page
        description: Page number
      - name: size
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          description: Page size
          default: 50
          title: Size
        description: Page size
      - name: search
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Search model names (case-insensitive partial match)
          title: Search
        description: Search model names (case-insensitive partial match)
      - name: modelId
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Search for a specific model by its unique ID
          title: Modelid
        description: Search for a specific model by its unique ID
      - name: teamId
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter models by team ID. Returns models with direct_access=True or teamId in access_via_team_ids
          title: Teamid
        description: Filter models by team ID. Returns models with direct_access=True or teamId in access_via_team_ids
      - name: sortBy
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 'Field to sort by. Options: model_name, created_at, updated_at, costs, status'
          title: Sortby
        description: 'Field to sort by. Options: model_name, created_at, updated_at, costs, status'
      - name: sortOrder
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 'Sort order. Options: asc, desc'
          default: asc
          title: Sortorder
        description: 'Sort order. Options: asc, desc'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/model/info:
    get:
      tags:
      - Model Management
      summary: Model Info V1
      description: 'Provides more info about each model in /models, including config.yaml descriptions (except api key and api base)


        Parameters:

        litellm_model_id: Optional[str] = None (this is the value of `x-litellm-model-id` returned in response headers)


        - When litellm_model_id is passed, it will return the info for that specific model

        - When litellm_model_id is not passed, it will return the info for all models

        - include_team_models: When true, filter to deployments the caller can use (same as /v2/model/info).

        - teamId: Filter to models accessible by the given team.


        Each model in the list response includes `model_info.access_via_team_ids` and

        `model_info.direct_access` when the proxy database is connected.


        Returns:

        Returns a dictionary containing information about each model.


        Example Response:

        ```json

        {

        "data": [

        {

        "model_name": "fake-openai-endpoint",

        "litellm_params": {

        "api_base": "https://exampleopenaiendpoint-production.up.railway.app/",

        "model": "openai/fake"

        },

        "model_info": {

        "id": "112f74fab24a7a5245d2ced3536dd8f5f9192c57ee6e332af0f0512e08bed5af",

        "db_model": false

        }

        }

        ]

        }


        ```'
      operationId: model_info_v1_v1_model_info_get
      security:
      - APIKeyHeader: []
      parameters:
      - name: litellm_model_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Litellm Model Id
      - name: include_team_models
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          description: When true, filter to deployments the caller can use via direct access or team membership.
          default: false
          title: Include Team Models
        description: When true, filter to deployments the caller can use via direct access or team membership.
      - name: teamId
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter models by team ID. Returns models with direct_access=True or teamId in access_via_team_ids
          title: Teamid
        description: Filter models by team ID. Returns models with direct_access=True or teamId in access_via_team_ids
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
