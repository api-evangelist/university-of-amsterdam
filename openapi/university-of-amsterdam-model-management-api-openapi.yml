openapi: 3.2.0
info:
  title: LiteLLM model management API
  description: 'Enterprise Edition


    Proxy Server to call 100+ LLMs in the OpenAI format. **Customize Swagger Docs**


    👉 ```LiteLLM Admin Panel on /ui```. Create, Edit Keys with SSO. Having issues? Try ```Fallback Login```


    💸 ```LiteLLM Model Cost Map```.


    🔎 ```LiteLLM Model Hub```. See available models on the proxy. **Docs**'
  version: 1.95.0
tags:
- name: Model Management
paths:
  /models:
    get:
      tags:
      - Model Management
      summary: Model List
      description: 'Use `/model/info` - to get detailed model information, example - pricing, mode, etc.


        This is just for compatibility with openai projects like aider.


        Query Parameters:

        - include_metadata: Include additional metadata in the response with fallback information

        - fallback_type: Type of fallbacks to include ("general", "context_window", "content_policy")

        Defaults to "general" when include_metadata=true

        - scope: Optional scope parameter. Currently only accepts "expand".

        When scope=expand is passed, proxy admins, team admins, and org admins

        will receive all proxy models as if they are a proxy admin.

        - healthy_only: When true, hide models whose backing deployments are all marked

        unhealthy by background health checks. Requires

        `background_health_checks: true` in general_settings; without

        health state the listing is returned unfiltered (fail open).

        Models expanded from wildcard routes (e.g. `openai/*`) are not

        filtered, and nothing is hidden when `allowed_fails_policy` is

        configured (cooldown remains the sole exclusion mechanism).

        Hiding is presentation-only: a hidden model can still be

        called directly.'
      operationId: model_list_models_get
      security:
      - APIKeyHeader: []
      parameters:
      - name: return_wildcard_routes
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          default: false
          title: Return Wildcard Routes
      - name: team_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Team Id
      - name: include_model_access_groups
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          default: false
          title: Include Model Access Groups
      - name: only_model_access_groups
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          default: false
          title: Only Model Access Groups
      - name: include_metadata
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          default: false
          title: Include Metadata
      - name: fallback_type
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Fallback Type
      - name: scope
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Scope
      - name: healthy_only
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          default: false
          title: Healthy Only
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
