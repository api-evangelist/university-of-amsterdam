openapi: 3.2.0
info:
  title: LiteLLM Provider API
  description: 'Enterprise Edition


    Proxy Server to call 100+ LLMs in the OpenAI format. **Customize Swagger Docs**


    👉 ```LiteLLM Admin Panel on /ui```. Create, Edit Keys with SSO. Having issues? Try ```Fallback Login```


    💸 ```LiteLLM Model Cost Map```.


    🔎 ```LiteLLM Model Hub```. See available models on the proxy. **Docs**'
  version: 1.95.0
tags:
- name: Provider
paths:
  /provider/budgets:
    get:
      summary: Provider Budgets
      description: 'Provider Budget Routing - Get Budget, Spend Details https://docs.litellm.ai/docs/proxy/provider_budget_routing


        Use this endpoint to check current budget, spend and budget reset time for a provider


        Example Request


        ```bash

        curl -X GET http://localhost:4000/provider/budgets -H "Content-Type: application/json" -H "Authorization: Bearer sk-1234"

        ```


        Example Response


        ```json

        {

        "providers": {

        "openai": {

        "budget_limit": 1e-12,

        "time_period": "1d",

        "spend": 0.0,

        "budget_reset_at": null

        },

        "azure": {

        "budget_limit": 100.0,

        "time_period": "1d",

        "spend": 0.0,

        "budget_reset_at": null

        },

        "anthropic": {

        "budget_limit": 100.0,

        "time_period": "10d",

        "spend": 0.0,

        "budget_reset_at": null

        },

        "vertex_ai": {

        "budget_limit": 100.0,

        "time_period": "12d",

        "spend": 0.0,

        "budget_reset_at": null

        }

        }

        }

        ```'
      operationId: provider_budgets_provider_budgets_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderBudgetResponse'
      security:
      - APIKeyHeader: []
      tags:
      - Provider
components:
  schemas:
    ProviderBudgetResponse:
      properties:
        providers:
          additionalProperties:
            $ref: '#/components/schemas/ProviderBudgetResponseObject'
          type: object
          title: Providers
          default: {}
      type: object
      title: ProviderBudgetResponse
      description: 'Complete provider budget configuration and status.

        Maps provider names to their budget configs.'
    ProviderBudgetResponseObject:
      properties:
        budget_limit:
          anyOf:
          - type: number
          - type: 'null'
          title: Budget Limit
        time_period:
          anyOf:
          - type: string
          - type: 'null'
          title: Time Period
        spend:
          anyOf:
          - type: number
          - type: 'null'
          title: Spend
          default: 0.0
        budget_reset_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Budget Reset At
      type: object
      required:
      - budget_limit
      - time_period
      title: ProviderBudgetResponseObject
      description: Configuration for a single provider's budget settings
  securitySchemes:
    APIKeyHeader:
      type: apiKey
      description: Bearer token
      in: header
      name: x-litellm-api-key
