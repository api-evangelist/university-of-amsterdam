openapi: 3.2.0
info:
  title: LiteLLM Realtime API
  description: 'Enterprise Edition


    Proxy Server to call 100+ LLMs in the OpenAI format. **Customize Swagger Docs**


    👉 ```LiteLLM Admin Panel on /ui```. Create, Edit Keys with SSO. Having issues? Try ```Fallback Login```


    💸 ```LiteLLM Model Cost Map```.


    🔎 ```LiteLLM Model Hub```. See available models on the proxy. **Docs**'
  version: 1.95.0
tags:
- name: Realtime
paths:
  /openai/v1/realtime/calls:
    post:
      operationId: proxy_realtime_calls_openai_v1_realtime_calls_post
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Proxy Realtime Calls
      tags:
      - Realtime
  /openai/v1/realtime/client_secrets:
    post:
      operationId: create_realtime_client_secret_openai_v1_realtime_client_secrets_post
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RealtimeClientSecretResponse'
          description: Successful Response
      security:
      - APIKeyHeader: []
      summary: Create Realtime Client Secret
      tags:
      - Realtime
  /realtime/calls:
    post:
      operationId: proxy_realtime_calls_realtime_calls_post
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Proxy Realtime Calls
      tags:
      - Realtime
  /realtime/client_secrets:
    post:
      operationId: create_realtime_client_secret_realtime_client_secrets_post
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RealtimeClientSecretResponse'
          description: Successful Response
      security:
      - APIKeyHeader: []
      summary: Create Realtime Client Secret
      tags:
      - Realtime
  /v1/realtime/calls:
    post:
      operationId: proxy_realtime_calls_v1_realtime_calls_post
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Proxy Realtime Calls
      tags:
      - Realtime
  /v1/realtime/client_secrets:
    post:
      operationId: create_realtime_client_secret_v1_realtime_client_secrets_post
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RealtimeClientSecretResponse'
          description: Successful Response
      security:
      - APIKeyHeader: []
      summary: Create Realtime Client Secret
      tags:
      - Realtime
components:
  schemas:
    RealtimeClientSecretResponse:
      description: 'Response from POST /v1/realtime/client_secrets.


        Both the top-level `value` and `session.client_secret.value`

        will contain the encrypted token instead of the raw ephemeral key.

        The `session` field is kept as a raw dict so unknown fields pass through.'
      properties:
        expires_at:
          anyOf:
          - type: integer
          - type: 'null'
          title: Expires At
        session:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Session
        value:
          title: Value
          type: string
      required:
      - value
      title: RealtimeClientSecretResponse
      type: object
  securitySchemes:
    APIKeyHeader:
      type: apiKey
      description: Bearer token
      in: header
      name: x-litellm-api-key
