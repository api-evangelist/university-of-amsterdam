openapi: 3.2.0
info:
  title: LiteLLM Vector Stores API
  description: 'Enterprise Edition


    Proxy Server to call 100+ LLMs in the OpenAI format. **Customize Swagger Docs**


    👉 ```LiteLLM Admin Panel on /ui```. Create, Edit Keys with SSO. Having issues? Try ```Fallback Login```


    💸 ```LiteLLM Model Cost Map```.


    🔎 ```LiteLLM Model Hub```. See available models on the proxy. **Docs**'
  version: 1.95.0
tags:
- name: Vector Stores
paths:
  /v1/indexes:
    post:
      description: 'Create an index. Just writes the index to the database.


        ```bash

        curl -L -X POST ''http://0.0.0.0:4000/indexes/create'' -H ''Content-Type: application/json'' -H ''Authorization: Bearer sk-1234'' -H ''LiteLLM-Beta: indexes_beta=v1'' -d ''{

        "index_name": "dall-e-3",

        "vector_store_index": "real-index-name",

        "vector_store_name": "azure-ai-search"

        }''

        ```'
      operationId: index_create_v1_indexes_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IndexCreateRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - APIKeyHeader: []
      summary: Index Create
      tags:
      - Vector Stores
