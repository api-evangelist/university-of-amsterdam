openapi: 3.2.0
info:
  title: LiteLLM Langfuse Passthrough API
  description: 'Enterprise Edition


    Proxy Server to call 100+ LLMs in the OpenAI format. **Customize Swagger Docs**


    👉 ```LiteLLM Admin Panel on /ui```. Create, Edit Keys with SSO. Having issues? Try ```Fallback Login```


    💸 ```LiteLLM Model Cost Map```.


    🔎 ```LiteLLM Model Hub```. See available models on the proxy. **Docs**'
  version: 1.95.0
tags:
- name: langfuse_passthrough
paths:
  /langfuse/{endpoint}:
    delete:
      description: 'Call Langfuse via LiteLLM proxy. Works with Langfuse SDK.


        Docs'
      operationId: langfuse_proxy_route_langfuse__endpoint__delete
      parameters:
      - in: path
        name: endpoint
        required: true
        schema:
          title: Endpoint
          type: string
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Langfuse Proxy Route
      tags:
      - langfuse_passthrough
