openapi: 3.2.0
info:
  title: LiteLLM Interactions API
  description: 'Enterprise Edition


    Proxy Server to call 100+ LLMs in the OpenAI format. **Customize Swagger Docs**


    👉 ```LiteLLM Admin Panel on /ui```. Create, Edit Keys with SSO. Having issues? Try ```Fallback Login```


    💸 ```LiteLLM Model Cost Map```.


    🔎 ```LiteLLM Model Hub```. See available models on the proxy. **Docs**'
  version: 1.95.0
tags:
- name: Interactions
paths:
  /interactions:
    post:
      tags:
      - Interactions
      summary: Create Interaction
      description: 'Create a new interaction using Google''s Interactions API.


        Per OpenAPI spec: POST /{api_version}/interactions


        Supports both model interactions and agent interactions:

        - Model: Provide `model` parameter (e.g., "gemini-2.5-flash")

        - Agent: Provide `agent` parameter (e.g., "deep-research-pro-preview-12-2025")


        Example:

        ```bash

        curl -X POST "http://localhost:4000/v1beta/interactions" -H "Authorization: Bearer sk-1234" -H "Content-Type: application/json" -d ''{

        "model": "gemini/gemini-2.5-flash",

        "input": "Hello, how are you?"

        }''

        ```'
      operationId: create_interaction_interactions_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - APIKeyHeader: []
  /v1beta/interactions:
    post:
      tags:
      - Interactions
      summary: Create Interaction
      description: 'Create a new interaction using Google''s Interactions API.


