      summary: Get Interaction
      description: 'Get an interaction by ID.


        Per OpenAPI spec: GET /{api_version}/interactions/{interaction_id}'
      operationId: get_interaction_interactions__interaction_id__get
      security:
      - APIKeyHeader: []
      parameters:
      - name: interaction_id
        in: path
        required: true
        schema:
