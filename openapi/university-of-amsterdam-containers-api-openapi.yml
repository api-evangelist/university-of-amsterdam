        ```


        Or specify provider via header:

        ```bash

        curl -X GET "http://localhost:4000/v1/containers/cntr_123" -H "Authorization: Bearer sk-1234" -H "custom-llm-provider: azure"

        ```'
      operationId: retrieve_container_containers__container_id__get
      security:
      - APIKeyHeader: []
      parameters:
      - name: container_id
        in: path
        required: true
        schema:
          type: string
          title: Container Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
