        ```bash

        curl -X DELETE "http://localhost:4000/v1/containers/cntr_123"         -H "Authorization: Bearer sk-1234"         -H "custom-llm-provider: azure"

        ```'
      operationId: delete_container_containers__container_id__delete
      security:
      - APIKeyHeader: []
