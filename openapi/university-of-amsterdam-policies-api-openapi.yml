openapi: 3.2.0
info:
  title: LiteLLM Policies API
  description: 'Enterprise Edition


    Proxy Server to call 100+ LLMs in the OpenAI format. **Customize Swagger Docs**


    👉 ```LiteLLM Admin Panel on /ui```. Create, Edit Keys with SSO. Having issues? Try ```Fallback Login```


    💸 ```LiteLLM Model Cost Map```.


    🔎 ```LiteLLM Model Hub```. See available models on the proxy. **Docs**'
  version: 1.95.0
tags:
- name: Policies
paths:
  /policies/list:
    get:
      tags:
      - Policies
      summary: List Policies
      description: 'List all policies from the database. Optionally filter by version_status.


        Query params:

        - version_status: Optional. One of "draft", "published", "production".

        If omitted, all versions are returned.


        Example Request:

        ```bash

        curl -X GET "http://localhost:4000/policies/list" \

        -H "Authorization: Bearer "

        curl -X GET "http://localhost:4000/policies/list?version_status=production" \

        -H "Authorization: Bearer "

        ```


        Example Response:

        ```json

        {

        "policies": [

        {

        "policy_id": "123e4567-e89b-12d3-a456-426614174000",

        "policy_name": "global-baseline",

        "version_number": 1,

        "version_status": "production",

        "inherit": null,

        "description": "Base guardrails for all requests",

        "guardrails_add": ["pii_masking"],

        "guardrails_remove": [],

        "condition": null,

        "created_at": "2024-01-01T00:00:00Z",

        "updated_at": "2024-01-01T00:00:00Z"

        }

        ],

        "total_count": 1

        }

        ```'
      operationId: list_policies_policies_list_get
      security:
      - APIKeyHeader: []
      parameters:
      - name: version_status
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Version Status
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyListDBResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /policies:
    post:
      tags:
      - Policies
      summary: Create Policy
      description: 'Create a new policy.


        Example Request:

        ```bash

        curl -X POST "http://localhost:4000/policies" \

        -H "Authorization: Bearer " \

        -H "Content-Type: application/json" \

        -d ''{

        "policy_name": "global-baseline",

        "description": "Base guardrails for all requests",

        "guardrails_add": ["pii_masking", "prompt_injection"],

        "guardrails_remove": []

        }''

        ```


        Example Response:

        ```json

        {

        "policy_id": "123e4567-e89b-12d3-a456-426614174000",

        "policy_name": "global-baseline",

        "inherit": null,

        "description": "Base guardrails for all requests",

        "guardrails_add": ["pii_masking", "prompt_injection"],

        "guardrails_remove": [],

        "condition": null,

        "created_at": "2024-01-01T00:00:00Z",

        "updated_at": "2024-01-01T00:00:00Z"

        }

        ```'
      operationId: create_policy_policies_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicyCreateRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyDBResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - APIKeyHeader: []
  /policies/name/{policy_name}/versions:
    get:
      tags:
      - Policies
      summary: List Policy Versions
      description: List all versions of a policy by name, ordered by version_number descending.
      operationId: list_policy_versions_policies_name__policy_name__versions_get
      security:
      - APIKeyHeader: []
      parameters:
      - name: policy_name
        in: path
        required: true
        schema:
          type: string
          title: Policy Name
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyVersionListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - Policies
      summary: Create Policy Version
      description: 'Create a new draft version of a policy. Copies all fields from the source.

        Source is current production if source_policy_id is not provided.'
      operationId: create_policy_version_policies_name__policy_name__versions_post
      security:
      - APIKeyHeader: []
      parameters:
      - name: policy_name
        in: path
        required: true
        schema:
          type: string
          title: Policy Name
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicyVersionCreateRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyDBResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /policies/{policy_id}/status:
    put:
      tags:
      - Policies
      summary: Update Policy Version Status
      description: 'Update a policy version''s status. Valid transitions:

        - draft -> published

        - published -> production (demotes current production to published)

        - production -> published (demotes, policy becomes inactive)'
      operationId: update_policy_version_status_policies__policy_id__status_put
      security:
      - APIKeyHeader: []
      parameters:
      - name: policy_id
        in: path
        required: true
        schema:
          type: string
          title: Policy Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicyVersionStatusUpdateRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyDBResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /policies/compare:
    get:
      tags:
      - Policies
      summary: Compare Policy Versions
      description: 'Compare two policy versions. Query params: version_a, version_b (policy version IDs).'
      operationId: compare_policy_versions_policies_compare_get
      security:
      - APIKeyHeader: []
      parameters:
      - name: version_a
        in: query
        required: true
        schema:
          type: string
          title: Version A
      - name: version_b
        in: query
        required: true
        schema:
          type: string
          title: Version B
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyVersionCompareResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /policies/name/{policy_name}/all-versions:
    delete:
      tags:
      - Policies
      summary: Delete All Policy Versions
      description: Delete all versions of a policy. Also removes from in-memory registry.
      operationId: delete_all_policy_versions_policies_name__policy_name__all_versions_delete
      security:
      - APIKeyHeader: []
      parameters:
      - name: policy_name
        in: path
        required: true
        schema:
          type: string
          title: Policy Name
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /policies/{policy_id}:
    get:
      tags:
      - Policies
      summary: Get Policy
      description: 'Get a policy by ID.


        Example Request:

        ```bash

        curl -X GET "http://localhost:4000/policies/123e4567-e89b-12d3-a456-426614174000" \

        -H "Authorization: Bearer "

        ```'
      operationId: get_policy_policies__policy_id__get
      security:
      - APIKeyHeader: []
      parameters:
      - name: policy_id
        in: path
        required: true
        schema:
          type: string
          title: Policy Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyDBResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - Policies
      summary: Update Policy
      description: 'Update an existing policy.


        Example Request:

        ```bash

        curl -X PUT "http://localhost:4000/policies/123e4567-e89b-12d3-a456-426614174000" \

        -H "Authorization: Bearer " \

        -H "Content-Type: application/json" \

        -d ''{

        "description": "Updated description",

        "guardrails_add": ["pii_masking", "toxicity_filter"]

        }''

        ```'
      operationId: update_policy_policies__policy_id__put
      security:
      - APIKeyHeader: []
      parameters:
      - name: policy_id
        in: path
        required: true
        schema:
          type: string
          title: Policy Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicyUpdateRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyDBResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Policies
      summary: Delete Policy
      description: 'Delete a policy.


        Example Request:

        ```bash

        curl -X DELETE "http://localhost:4000/policies/123e4567-e89b-12d3-a456-426614174000" \

        -H "Authorization: Bearer "

        ```


        Example Response:

        ```json

        {

        "message": "Policy 123e4567-e89b-12d3-a456-426614174000 deleted successfully"

        }

        ```'
      operationId: delete_policy_policies__policy_id__delete
      security:
      - APIKeyHeader: []
      parameters:
      - name: policy_id
        in: path
        required: true
        schema:
          type: string
          title: Policy Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /policies/{policy_id}/resolved-guardrails:
    get:
      tags:
      - Policies
      summary: Get Resolved Guardrails
      description: 'Get the resolved guardrails for a policy (including inherited guardrails).


        This endpoint resolves the full inheritance chain and returns the final

        set of guardrails that would be applied for this policy.


        Example Request:

        ```bash

        curl -X GET "http://localhost:4000/policies/123e4567-e89b-12d3-a456-426614174000/resolved-guardrails" \

        -H "Authorization: Bearer "

        ```


        Example Response:

        ```json

        {

        "policy_id": "123e4567-e89b-12d3-a456-426614174000",

        "policy_name": "healthcare-compliance",

        "resolved_guardrails": ["pii_masking", "prompt_injection", "toxicity_filter"]

        }

        ```'
      operationId: get_resolved_guardrails_policies__policy_id__resolved_guardrails_get
      security:
      - APIKeyHeader: []
      parameters:
      - name: policy_id
        in: path
        required: true
        schema:
          type: string
          title: Policy Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /policies/test-pipeline:
    post:
      tags:
      - Policies
      summary: Test Pipeline
      description: 'Test a guardrail pipeline with sample messages.


        Executes the pipeline steps against the provided test messages and returns

        step-by-step results showing which guardrails passed/failed, actions taken,

        and timing information.


        Example Request:

        ```bash

        curl -X POST "http://localhost:4000/policies/test-pipeline" \

        -H "Authorization: Bearer " \

        -H "Content-Type: application/json" \

        -d ''{

        "pipeline": {

        "mode": "pre_call",

        "steps": [

        {"guardrail": "pii-guard", "on_pass": "next", "on_fail": "block"}

        ]

        },

        "test_messages": [{"role": "user", "content": "My SSN is 123-45-6789"}]

        }''

        ```'
      operationId: test_pipeline_policies_test_pipeline_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PipelineTestRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - APIKeyHeader: []
  /policies/attachments/list:
    get:
      tags:
      - Policies
      summary: List Policy Attachments
      description: 'List all policy attachments from the database.


        Example Request:

        ```bash

        curl -X GET "http://localhost:4000/policies/attachments/list" \

        -H "Authorization: Bearer "

        ```


        Example Response:

        ```json

        {

        "attachments": [

        {

        "attachment_id": "123e4567-e89b-12d3-a456-426614174000",

        "policy_name": "global-baseline",

        "scope": "*",

        "teams": [],

        "keys": [],

        "models": [],

        "created_at": "2024-01-01T00:00:00Z",

        "updated_at": "2024-01-01T00:00:00Z"

        }

        ],

        "total_count": 1

        }

        ```'
      operationId: list_policy_attachments_policies_attachments_list_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyAttachmentListResponse'
      security:
      - APIKeyHeader: []
  /policies/attachments:
    post:
      tags:
      - Policies
      summary: Create Policy Attachment
      description: 'Create a new policy attachment.


        Example Request:

        ```bash

        curl -X POST "http://localhost:4000/policies/attachments" \

        -H "Authorization: Bearer " \

        -H "Content-Type: application/json" \

        -d ''{

        "policy_name": "global-baseline",

        "scope": "*"

        }''

        ```


        Example with team-specific attachment:

        ```bash

        curl -X POST "http://localhost:4000/policies/attachments" \

        -H "Authorization: Bearer " \

        -H "Content-Type: application/json" \

        -d ''{

        "policy_name": "healthcare-compliance",

        "teams": ["healthcare-team", "medical-research"]

        }''

        ```


        Example Response:

        ```json

        {

        "attachment_id": "123e4567-e89b-12d3-a456-426614174000",

        "policy_name": "global-baseline",

        "scope": "*",

        "teams": [],

        "keys": [],

        "models": [],

        "created_at": "2024-01-01T00:00:00Z",

        "updated_at": "2024-01-01T00:00:00Z"

        }

        ```'
      operationId: create_policy_attachment_policies_attachments_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicyAttachmentCreateRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyAttachmentDBResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - APIKeyHeader: []
  /policies/attachments/{attachment_id}:
    get:
      tags:
      - Policies
      summary: Get Policy Attachment
      description: 'Get a policy attachment by ID.


        Example Request:

        ```bash

        curl -X GET "http://localhost:4000/policies/attachments/123e4567-e89b-12d3-a456-426614174000" \

        -H "Authorization: Bearer "

        ```'
      operationId: get_policy_attachment_policies_attachments__attachment_id__get
      security:
      - APIKeyHeader: []
      parameters:
      - name: attachment_id
        in: path
        required: true
        schema:
          type: string
          title: Attachment Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyAttachmentDBResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Policies
      summary: Delete Policy Attachment
      description: 'Delete a policy attachment.


        Example Request:

        ```bash

        curl -X DELETE "http://localhost:4000/policies/attachments/123e4567-e89b-12d3-a456-426614174000" \

        -H "Authorization: Bearer "

        ```


        Example Response:

        ```json

        {

        "message": "Attachment 123e4567-e89b-12d3-a456-426614174000 deleted successfully"

        }

        ```'
      operationId: delete_policy_attachment_policies_attachments__attachment_id__delete
      security:
      - APIKeyHeader: []
      parameters:
      - name: attachment_id
        in: path
        required: true
        schema:
          type: string
          title: Attachment Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /policies/usage/overview:
    get:
      tags:
      - Policies
      summary: Policies Usage Overview
      description: Return policy performance overview for the dashboard.
      operationId: policies_usage_overview_policies_usage_overview_get
      security:
      - APIKeyHeader: []
      parameters:
      - name: start_date
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: YYYY-MM-DD
          title: Start Date
        description: YYYY-MM-DD
      - name: end_date
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: YYYY-MM-DD
          title: End Date
        description: YYYY-MM-DD
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageOverviewResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /policy/info/{policy_name}:
    get:
      description: 'Get detailed information about a specific policy.


        Returns:

        - Policy configuration

        - Resolved guardrails (after inheritance)

        - Inheritance chain'
      operationId: get_policy_info_policy_info__policy_name__get
      parameters:
      - in: path
        name: policy_name
        required: true
        schema:
          title: Policy Name
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyInfoResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - APIKeyHeader: []
      summary: Get Policy Info
      tags:
      - Policies
  /policy/list:
    get:
      description: 'List all loaded policies with their resolved guardrails.


        Returns information about each policy including:

        - Inheritance configuration

        - Scope (teams, keys, models)

        - Guardrails to add/remove

        - Resolved guardrails (after inheritance)

        - Inheritance chain'
      operationId: list_policies_policy_list_get
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyListResponse'
          description: Successful Response
      security:
      - APIKeyHeader: []
      summary: List Policies
      tags:
      - Policies
  /policy/templates:
    get:
      description: 'Get policy templates for the UI (pre-configured guardrail combinations).


        Fetches from GitHub with automatic fallback to local backup on failure.

        Set LITELLM_LOCAL_POLICY_TEMPLATES=true to skip GitHub and use local backup only.'
      operationId: get_policy_templates_policy_templates_get
      responses:
        '200':
          content:
            application/json:
              schema:
                items: {}
                title: Response Get Policy Templates Policy Templates Get
                type: array
          description: Successful Response
      security:
      - APIKeyHeader: []
      summary: Get Policy Templates
      tags:
      - Policies
  /policy/templates/enrich:
    post:
      description: 'Enrich a policy template with LLM-discovered data (e.g. competitor names).


        Calls an onboarded LLM to discover competitors for the given brand name,

        then returns enriched guardrailDefinitions with the discovered data populated.'
      operationId: enrich_policy_template_policy_templates_enrich_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnrichTemplateRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Enrich Policy Template Policy Templates Enrich Post
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - APIKeyHeader: []
      summary: Enrich Policy Template
      tags:
      - Policies
  /policy/templates/enrich/stream:
    post:
      description: 'Stream competitor names as SSE events as the LLM generates them.


        Events:

        - data: {"type": "competitor", "name": "..."} — each competitor as discovered

        - data: {"type": "done", "competitors": [...], "competitor_variations": {...}, "guardrailDefinitions": [...]}'
      operationId: enrich_policy_template_stream_policy_templates_enrich_stream_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnrichTemplateRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - APIKeyHeader: []
      summary: Enrich Policy Template Stream
      tags:
      - Policies
  /policy/templates/suggest:
    post:
      description: 'Use AI to suggest policy templates based on attack examples and descriptions.


        Calls an LLM with tool calling to match user requirements to available templates.'
      operationId: suggest_policy_templates_policy_templates_suggest_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuggestTemplatesRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Suggest Policy Templates Policy Templates Suggest Post
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - APIKeyHeader: []
      summary: Suggest Policy Templates
      tags:
      - Policies
  /policy/templates/test:
    post:
      description: 'Test a policy template''s guardrails against a text input without creating them.


        Instantiates temporary guardrails from the template definitions, runs them

        against the provided text, and returns per-guardrail results so users can

        verify the template solves their problem before creating it.'
      operationId: test_policy_template_policy_templates_test_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestPolicyTemplateRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestPolicyTemplateResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - APIKeyHeader: []
      summary: Test Policy Template
      tags:
      - Policies
  /policy/test:
    post:
      description: 'Test which policies would match a given request context.


        This is useful for debugging and understanding policy behavior.


        Request body:

        ```json

        {

        "team_alias": "healthcare-team",

        "key_alias": "my-api-key",

        "model": "gpt-4"

        }

        ```


        Returns:

        - matching_policies: List of policy names that match

        - resolved_guardrails: Final list of guardrails that would be applied'
      operationId: test_policy_matching_policy_test_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicyMatchContext'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyTestResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - APIKeyHeader: []
      summary: Test Policy Matching
      tags:
      - Policies
  /policy/validate:
    post:
      description: 'Validate a policy configuration before applying it.


        Checks:

        - All referenced guardrails exist in the guardrail registry

        - All non-wildcard team aliases exist in the database

        - All non-wildcard key aliases exist in the database

        - Inheritance chains are valid (no cycles, parents exist)

        - Scope patterns are syntactically valid


        Returns:

        - valid: True if the policy configuration is valid (no blocking errors)

        - errors: List of blocking validation errors

        - warnings: List of non-blocking validation warnings


        Example request:

        ```json

        {

        "policies": {

        "global-baseline": {

        "guardrails": {

        "add": ["pii_blocker", "phi_blocker"]

        },

        "scope": {

        "teams": ["*"],

        "keys": ["*"],

        "models": ["*"]

        }

        },

        "healthcare-compliance": {

        "inherit": "global-baseline",

        "guardrails": {

        "add": ["hipaa_audit"]

        },

        "scope": {

        "teams": ["healthcare-team"]

        }

        }

        }

        }

        ```'
      operationId: validate_policy_policy_validate_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicyValidateRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyValidationResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - APIKeyHeader: []
      summary: Validate Policy
      tags:
      - Policies
  /utils/test_policies_and_guardrails:
    post:
      description: 'Apply policies and/or guardrails to inputs (for compliance UI testing).


        Use inputs_list for batch testing: each input is processed as a separate call so

        per-input block/allow and errors are returned.


        Use inputs for a single call (legacy).'
      operationId: test_policies_and_guardrails_utils_test_policies_and_guardrails_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestPoliciesAndGuardrailsRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - APIKeyHeader: []
      summary: Test Policies And Guardrails
      tags:
      - Policies
