components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    AccessGroupResponse:
      properties:
        access_group_id:
          type: string
          title: Access Group Id
        access_group_name:
          type: string
          title: Access Group Name
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        access_model_names:
          items:
            type: string
          type: array
          title: Access Model Names
        access_mcp_server_ids:
          items:
            type: string
          type: array
          title: Access Mcp Server Ids
        access_agent_ids:
          items:
            type: string
          type: array
          title: Access Agent Ids
        assigned_team_ids:
          items:
            type: string
          type: array
          title: Assigned Team Ids
        assigned_key_ids:
          items:
            type: string
          type: array
          title: Assigned Key Ids
        created_at:
          type: string
          format: date-time
          title: Created At
        created_by:
          anyOf:
          - type: string
          - type: 'null'
          title: Created By
        updated_at:
          type: string
          format: date-time
          title: Updated At
        updated_by:
          anyOf:
          - type: string
          - type: 'null'
          title: Updated By
      type: object
      required:
      - access_group_id
      - access_group_name
      - access_model_names
      - access_mcp_server_ids
      - access_agent_ids
      - assigned_team_ids
      - assigned_key_ids
      - created_at
      - updated_at
      title: AccessGroupResponse
    AccessGroupCreateRequest:
      properties:
        access_group_name:
          type: string
          title: Access Group Name
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        access_model_names:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Access Model Names
        access_mcp_server_ids:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Access Mcp Server Ids
        access_agent_ids:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Access Agent Ids
        assigned_team_ids:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Assigned Team Ids
        assigned_key_ids:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Assigned Key Ids
      type: object
      required:
      - access_group_name
      title: AccessGroupCreateRequest
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    AccessGroupUpdateRequest:
      properties:
        access_group_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Access Group Name
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        access_model_names:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Access Model Names
        access_mcp_server_ids:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Access Mcp Server Ids
        access_agent_ids:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Access Agent Ids
        assigned_team_ids:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Assigned Team Ids
        assigned_key_ids:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Assigned Key Ids
      type: object
      title: AccessGroupUpdateRequest
  securitySchemes:
    APIKeyHeader:
      type: apiKey
      description: Bearer token
      in: header
      name: x-litellm-api-key
