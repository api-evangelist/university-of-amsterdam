              schema: {}
      security:
      - APIKeyHeader: []
  /cursor/chat/completions:
    post:
      tags:
      - responses
      summary: Cursor Chat Completions
      description: "Cursor-specific endpoint that accepts Responses API input format but returns chat completions format.\n\nThis endpoint handles requests from Cursor IDE which sends Responses API format (`input` field)\nbut expects chat completions format response (`choices`, `messages`, etc.).\n\n```bash\ncurl -X POST http://localhost:4000/cursor/chat/completions     -H \"Content-Type: application/json\"     -H \"Authorization: Bearer sk-1234\"     -d '{\n    \"model\": \"gpt-4o\",\n    \"input\": [{\"role\": \"user\", \"content\": \"Hello\"}]\n}'\nResponds back in chat completions format.\n```"
      operationId: cursor_chat_completions_cursor_chat_completions_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - APIKeyHeader: []
  /openai/v1/responses/{response_id}:
    get:
      tags:
      - responses
      summary: Get Response
      description: 'Get a response by ID.


        Supports both:

        - Polling IDs (litellm_poll_*): Returns cumulative cached content from background responses

        - Provider response IDs: Passes through to provider API


        Follows the OpenAI Responses API spec: https://platform.openai.com/docs/api-reference/responses/get


        ```bash

        # Get polling response

        curl -X GET http://localhost:4000/v1/responses/litellm_poll_abc123     -H "Authorization: Bearer sk-1234"


        # Get provider response

        curl -X GET http://localhost:4000/v1/responses/resp_abc123     -H "Authorization: Bearer sk-1234"

        ```'
      operationId: get_response_openai_v1_responses__response_id__get
      security:
      - APIKeyHeader: []
      parameters:
      - name: response_id
        in: path
        required: true
        schema:
          type: string
          title: Response Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - responses
      summary: Delete Response
      description: 'Delete a response by ID.


        Supports both:

        - Polling IDs (litellm_poll_*): Deletes from Redis cache

        - Provider response IDs: Passes through to provider API


        Follows the OpenAI Responses API spec: https://platform.openai.com/docs/api-reference/responses/delete


        ```bash

        curl -X DELETE http://localhost:4000/v1/responses/resp_abc123     -H "Authorization: Bearer sk-1234"

        ```'
      operationId: delete_response_openai_v1_responses__response_id__delete
      security:
      - APIKeyHeader: []
      parameters:
      - name: response_id
        in: path
        required: true
        schema:
          type: string
          title: Response Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
