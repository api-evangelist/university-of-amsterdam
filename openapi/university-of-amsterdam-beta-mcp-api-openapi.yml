openapi: 3.2.0
info:
  title: LiteLLM [beta] MCP API
  description: 'Enterprise Edition


    Proxy Server to call 100+ LLMs in the OpenAI format. **Customize Swagger Docs**


    👉 ```LiteLLM Admin Panel on /ui```. Create, Edit Keys with SSO. Having issues? Try ```Fallback Login```


    💸 ```LiteLLM Model Cost Map```.


    🔎 ```LiteLLM Model Hub```. See available models on the proxy. **Docs**'
  version: 1.95.0
tags:
- name: '[beta] MCP'
paths:
  /public/mcp_hub:
    get:
      tags:
      - '[beta] MCP'
      summary: Get Mcp Servers
      operationId: get_mcp_servers_public_mcp_hub_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/MCPPublicServer'
                type: array
                title: Response Get Mcp Servers Public Mcp Hub Get
components:
  schemas:
    MCPPublicServer:
      properties:
        server_id:
          type: string
          title: Server Id
        name:
          type: string
          title: Name
        alias:
          anyOf:
          - type: string
          - type: 'null'
          title: Alias
        server_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Server Name
        transport:
          type: string
          enum:
          - sse
          - http
          - stdio
          title: Transport
        spec_path:
          anyOf:
          - type: string
          - type: 'null'
          title: Spec Path
        auth_type:
          anyOf:
          - type: string
            enum:
            - none
            - api_key
            - bearer_token
            - basic
            - authorization
            - oauth2
            - aws_sigv4
            - token
            - oauth2_token_exchange
            - oauth2_id_jag
            - true_passthrough
            - oauth_delegate
          - type: 'null'
          title: Auth Type
        mcp_info:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Mcp Info
      type: object
      required:
      - server_id
      - name
      - transport
      title: MCPPublicServer
      description: Safe params for public MCP servers
  securitySchemes:
    APIKeyHeader:
      type: apiKey
      description: Bearer token
      in: header
      name: x-litellm-api-key
