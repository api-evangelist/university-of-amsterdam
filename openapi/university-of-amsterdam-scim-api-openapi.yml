components:
  schemas:
    SCIMUserEmail:
      properties:
        primary:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Primary
        type:
          anyOf:
          - type: string
          - type: 'null'
          title: Type
        value:
          format: email
          title: Value
          type: string
      required:
      - value
      title: SCIMUserEmail
      type: object
    SCIMServiceProviderConfig:
      properties:
        authenticationSchemes:
          anyOf:
          - items:
              additionalProperties: true
              type: object
            type: array
          - type: 'null'
          title: Authenticationschemes
        bulk:
          $ref: '#/components/schemas/SCIMFeature'
          default:
            supported: false
        changePassword:
          $ref: '#/components/schemas/SCIMFeature'
          default:
            supported: false
        etag:
          $ref: '#/components/schemas/SCIMFeature'
          default:
            supported: false
        filter:
          $ref: '#/components/schemas/SCIMFeature'
          default:
            supported: false
        meta:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Meta
        patch:
          $ref: '#/components/schemas/SCIMFeature'
          default:
            supported: true
        schemas:
          default:
          - urn:ietf:params:scim:schemas:core:2.0:ServiceProviderConfig
          items:
            type: string
          title: Schemas
          type: array
        sort:
          $ref: '#/components/schemas/SCIMFeature'
          default:
            supported: false
      title: SCIMServiceProviderConfig
      type: object
    SCIMFeature:
      properties:
        maxOperations:
          anyOf:
          - type: integer
          - type: 'null'
          title: Maxoperations
        maxPayloadSize:
          anyOf:
          - type: integer
          - type: 'null'
          title: Maxpayloadsize
        maxResults:
          anyOf:
          - type: integer
          - type: 'null'
          title: Maxresults
        supported:
          title: Supported
          type: boolean
      required:
      - supported
      title: SCIMFeature
      type: object
    SCIMGroup:
      properties:
        displayName:
          title: Displayname
          type: string
        externalId:
          anyOf:
          - type: string
          - type: 'null'
          title: Externalid
        id:
          anyOf:
          - type: string
          - type: 'null'
          title: Id
        members:
          anyOf:
          - items:
              $ref: '#/components/schemas/SCIMMember'
            type: array
          - type: 'null'
          title: Members
        meta:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Meta
        schemas:
          items:
            type: string
          title: Schemas
          type: array
      required:
      - schemas
      - displayName
      title: SCIMGroup
      type: object
    SCIMUserName:
      properties:
        familyName:
          anyOf:
          - type: string
          - type: 'null'
          title: Familyname
        formatted:
          anyOf:
          - type: string
          - type: 'null'
          title: Formatted
        givenName:
          anyOf:
          - type: string
          - type: 'null'
          title: Givenname
        honorificPrefix:
          anyOf:
          - type: string
          - type: 'null'
          title: Honorificprefix
        honorificSuffix:
          anyOf:
          - type: string
          - type: 'null'
          title: Honorificsuffix
        middleName:
          anyOf:
          - type: string
          - type: 'null'
          title: Middlename
      title: SCIMUserName
      type: object
    SCIMMember:
      properties:
        display:
          anyOf:
          - type: string
          - type: 'null'
          title: Display
        value:
          title: Value
          type: string
      required:
      - value
      title: SCIMMember
      type: object
    SCIMPatchOp:
      properties:
        Operations:
          items:
            $ref: '#/components/schemas/SCIMPatchOperation'
          title: Operations
          type: array
        schemas:
          default:
          - urn:ietf:params:scim:api:messages:2.0:PatchOp
          items:
            type: string
          title: Schemas
          type: array
      required:
      - Operations
      title: SCIMPatchOp
      type: object
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    SCIMUser:
      properties:
        active:
          default: true
          title: Active
          type: boolean
        displayName:
          anyOf:
          - type: string
          - type: 'null'
          title: Displayname
        emails:
          anyOf:
          - items:
              $ref: '#/components/schemas/SCIMUserEmail'
            type: array
          - type: 'null'
          title: Emails
        externalId:
          anyOf:
          - type: string
          - type: 'null'
          title: Externalid
        groups:
          anyOf:
          - items:
              $ref: '#/components/schemas/SCIMUserGroup'
            type: array
          - type: 'null'
          title: Groups
        id:
          anyOf:
          - type: string
          - type: 'null'
          title: Id
        meta:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Meta
        name:
          anyOf:
          - $ref: '#/components/schemas/SCIMUserName'
          - type: 'null'
        schemas:
          items:
            type: string
          title: Schemas
          type: array
        userName:
          anyOf:
          - type: string
          - type: 'null'
          title: Username
      required:
      - schemas
      title: SCIMUser
      type: object
    SCIMPatchOperation:
      properties:
        op:
          title: Op
          type: string
        path:
          anyOf:
          - type: string
          - type: 'null'
          title: Path
        value:
          anyOf:
          - {}
          - type: 'null'
          title: Value
      required:
      - op
      title: SCIMPatchOperation
      type: object
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    SCIMUserGroup:
      properties:
        display:
          anyOf:
          - type: string
          - type: 'null'
          title: Display
        type:
          anyOf:
          - type: string
          - type: 'null'
          default: direct
          title: Type
        value:
          title: Value
          type: string
      required:
      - value
      title: SCIMUserGroup
      type: object
    SCIMListResponse:
      properties:
        Resources:
          anyOf:
          - items:
              $ref: '#/components/schemas/SCIMUser'
            type: array
          - items:
              $ref: '#/components/schemas/SCIMGroup'
            type: array
          title: Resources
        itemsPerPage:
          anyOf:
          - type: integer
          - type: 'null'
          default: 10
          title: Itemsperpage
        schemas:
          default:
          - urn:ietf:params:scim:api:messages:2.0:ListResponse
          items:
            type: string
          title: Schemas
          type: array
        startIndex:
          anyOf:
          - type: integer
          - type: 'null'
          default: 1
          title: Startindex
