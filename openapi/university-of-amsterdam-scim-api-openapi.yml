          anyOf:
          - type: string
          - type: 'null'
          title: Feature
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SCIMPatchOp'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SCIMGroup'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - APIKeyHeader: []
      summary: Patch Group
      tags:
      - scim
    put:
      description: Update a group according to SCIM v2 protocol
      operationId: update_group_scim_v2_Groups__group_id__put
      parameters:
      - in: path
        name: group_id
        required: true
        schema:
          title: Group ID
          type: string
      - in: query
        name: feature
        required: false
