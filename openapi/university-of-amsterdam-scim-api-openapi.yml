      description: Get a single group by ID according to SCIM v2 protocol
      operationId: get_group_scim_v2_Groups__group_id__get
      parameters:
      - in: path
        name: group_id
        required: true
        schema:
          title: Group ID
          type: string
      - in: query
        name: feature
        required: false
        schema:
          anyOf:
