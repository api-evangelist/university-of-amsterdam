          - type: 'null'
          title: Feature
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SCIMGroup'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - APIKeyHeader: []
      summary: Get Group
      tags:
      - scim
    patch:
      description: Patch a group according to SCIM v2 protocol
      operationId: patch_group_scim_v2_Groups__group_id__patch
      parameters:
      - in: path
        name: group_id
        required: true
        schema:
          title: Group ID
          type: string
      - in: query
        name: feature
        required: false
