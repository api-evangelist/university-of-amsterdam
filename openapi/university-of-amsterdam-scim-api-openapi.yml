        name: group_id
        required: true
        schema:
          title: Group ID
          type: string
      - in: query
        name: feature
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Feature
      responses:
        '204':
          description: Successful Response
        '422':
          content:
            application/json:
