openapi: 3.2.0
info:
  title: LiteLLM Experimental API
  description: 'Enterprise Edition


    Proxy Server to call 100+ LLMs in the OpenAI format. **Customize Swagger Docs**


    👉 ```LiteLLM Admin Panel on /ui```. Create, Edit Keys with SSO. Having issues? Try ```Fallback Login```


    💸 ```LiteLLM Model Cost Map```.


    🔎 ```LiteLLM Model Hub```. See available models on the proxy. **Docs**'
  version: 1.95.0
tags:
- name: Experimental
paths:
  /sso/readiness:
    get:
      tags:
      - Experimental
      summary: Sso Readiness
      description: 'Health endpoint for checking SSO readiness.

        Checks if the configured SSO provider has all required environment variables set in memory.'
      operationId: sso_readiness_sso_readiness_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - APIKeyHeader: []
components:
  securitySchemes:
    APIKeyHeader:
      type: apiKey
      description: Bearer token
      in: header
      name: x-litellm-api-key
