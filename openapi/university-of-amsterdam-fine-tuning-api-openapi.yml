components:
  schemas:
    Hyperparameters:
      properties:
        batch_size:
          anyOf:
          - type: string
          - type: integer
          - type: 'null'
          title: Batch Size
        learning_rate_multiplier:
          anyOf:
          - type: string
          - type: number
          - type: 'null'
          title: Learning Rate Multiplier
        n_epochs:
          anyOf:
          - type: string
          - type: integer
          - type: 'null'
          title: N Epochs
      additionalProperties: true
      type: object
      title: Hyperparameters
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    LiteLLMFineTuningJobCreate:
      properties:
        model:
          type: string
          title: Model
        training_file:
          type: string
          title: Training File
        hyperparameters:
          anyOf:
          - $ref: '#/components/schemas/Hyperparameters'
          - type: 'null'
        suffix:
          anyOf:
          - type: string
          - type: 'null'
          title: Suffix
        validation_file:
          anyOf:
          - type: string
          - type: 'null'
          title: Validation File
        integrations:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Integrations
        seed:
          anyOf:
          - type: integer
          - type: 'null'
          title: Seed
        custom_llm_provider:
          anyOf:
          - type: string
            enum:
            - openai
            - azure
            - vertex_ai
          - type: 'null'
          title: Custom Llm Provider
      additionalProperties: true
      type: object
      required:
      - model
      - training_file
      title: LiteLLMFineTuningJobCreate
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
  securitySchemes:
    APIKeyHeader:
      type: apiKey
      description: Bearer token
      in: header
      name: x-litellm-api-key
