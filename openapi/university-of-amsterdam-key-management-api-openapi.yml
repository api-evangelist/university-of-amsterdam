          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /key/health:
    post:
      tags:
      - Key Management
      summary: Key Health
      description: 'Check the health of the key


        Checks:

        - If key based logging is configured correctly - sends a test log


        Usage


        Pass the key in the request header


        ```bash

        curl -X POST "http://localhost:4000/key/health" -H "Authorization: Bearer sk-1234" -H "Content-Type: application/json"

        ```


        Response when logging callbacks are setup correctly:


        ```json

        {

        "key": "healthy",

        "logging_callbacks": {

        "callbacks": [

        "gcs_bucket"

        ],

        "status": "healthy",

        "details": "No logger exceptions triggered, system is healthy. Manually check if logs were sent to [''gcs_bucket'']"

        }

        }

        ```


        Response when logging callbacks are not setup correctly:

        ```json

        {

        "key": "unhealthy",

        "logging_callbacks": {

        "callbacks": [

        "gcs_bucket"

        ],

        "status": "unhealthy",

        "details": "Logger exceptions triggered, system is unhealthy: Failed to load vertex credentials. Check to see if credentials containing partial/invalid information."

        }

        }

        ```'
      operationId: key_health_key_health_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KeyHealthResponse'
      security:
      - APIKeyHeader: []
