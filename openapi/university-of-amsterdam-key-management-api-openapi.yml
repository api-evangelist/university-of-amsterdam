        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /key/regenerate:
    post:
      tags:
      - Key Management
      summary: Regenerate Key Fn
      description: 'Regenerate an existing API key while optionally updating its parameters.


        Parameters:

        - key: str (path parameter) - The key to regenerate

        - data: Optional[RegenerateKeyRequest] - Request body containing optional parameters to update

        - key: Optional[str] - The key to regenerate.

        - new_master_key: Optional[str] - The new master key to use, if key is the master key.

        - new_key: Optional[str] - The new key to use, if key is not the master key. Must start with ''sk-'' and be at least 16 characters long. If both set, new_master_key will be used.

        - key_alias: Optional[str] - User-friendly key alias

        - user_id: Optional[str] - User ID associated with key

        - team_id: Optional[str] - Team ID associated with key

        - models: Optional[list] - Model_name''s a user is allowed to call

        - tags: Optional[List[str]] - Tags for organizing keys (Enterprise only)

        - spend: Optional[float] - Amount spent by key

        - max_budget: Optional[float] - Max budget for key

        - model_max_budget: Optional[Dict[str, BudgetConfig]] - Model-specific budgets {"gpt-4": {"budget_limit": 0.0005, "time_period": "30d"}}

        - budget_fallbacks: Optional[Dict[str, List[str]]] - Per-model fallback chain tried in order when that model''s own `model_max_budget` is exceeded, e.g. {"gpt-4o": ["gpt-4o-mini"]}.

        - budget_duration: Optional[str] - Budget reset period ("30d", "1h", etc.)

        - soft_budget: Optional[float] - Soft budget limit (warning vs. hard stop). Will trigger a slack alert when this soft budget is reached.

        - max_parallel_requests: Optional[int] - Rate limit for parallel requests

        - metadata: Optional[dict] - Metadata for key. Example {"team": "core-infra", "app": "app2"}

        - tpm_limit: Optional[int] - Tokens per minute limit

        - rpm_limit: Optional[int] - Requests per minute limit

        - model_rpm_limit: Optional[dict] - Model-specific RPM limits {"gpt-4": 100, "claude-v1": 200}

        - model_tpm_limit: Optional[dict] - Model-specific TPM limits {"gpt-4": 100000, "claude-v1": 200000}

        - allowed_cache_controls: Optional[list] - List of allowed cache control values

        - duration: Optional[str] - Key validity duration ("30d", "1h", etc.)

        - permissions: Optional[dict] - Key-specific permissions

        - guardrails: Optional[List[str]] - List of active guardrails for the key

        - blocked: Optional[bool] - Whether the key is blocked

        - grace_period: Optional[str] - Duration to keep old key valid after rotation (e.g. "24h", "2d"). Omitted = immediate revoke. Env: LITELLM_KEY_ROTATION_GRACE_PERIOD


        Returns:

        - GenerateKeyResponse containing the new key and its updated parameters


        Example:

        ```bash

        curl --location --request POST ''http://localhost:4000/key/sk-1234/regenerate'' --header ''Authorization: Bearer sk-1234'' --header ''Content-Type: application/json'' --data-raw ''{

        "max_budget": 100,

        "metadata": {"team": "core-infra"},

        "models": ["gpt-4", "gpt-3.5-turbo"]

        }''

        ```


        Note: This is an Enterprise feature. It requires a premium license to use.'
      operationId: regenerate_key_fn_key_regenerate_post
      security:
      - APIKeyHeader: []
      parameters:
      - name: key
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Key
      - name: litellm-changed-by
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: The litellm-changed-by header enables tracking of actions performed by authorized users on behalf of other users, providing an audit trail for accountability
          title: Litellm-Changed-By
        description: The litellm-changed-by header enables tracking of actions performed by authorized users on behalf of other users, providing an audit trail for accountability
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/RegenerateKeyRequest'
              - type: 'null'
              title: Data
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/GenerateKeyResponse'
                - type: 'null'
                title: Response Regenerate Key Fn Key Regenerate Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
