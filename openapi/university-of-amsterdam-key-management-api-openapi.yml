  /key/list:
    get:
      tags:
      - Key Management
      summary: List Keys
      description: 'List all keys for a given user / team / organization.


        Parameters:

        expand: Optional[List[str]] - Expand related objects (e.g. ''user'' to include user information)

        status: Optional[str] - Filter by status. Currently supports "deleted" to query deleted keys.


        Returns:

        {

        "keys": List[str] or List[UserAPIKeyAuth],

        "total_count": int,

        "current_page": int,

        "total_pages": int,

        }


        When expand includes "user", each key object will include a "user" field with the associated user object.

        Note: When expand=user is specified, full key objects are returned regardless of the return_full_object parameter.'
      operationId: list_keys_key_list_get
      security:
      - APIKeyHeader: []
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          description: Page number
          default: 1
          title: Page
        description: Page number
      - name: size
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: Page size
          default: 10
          title: Size
        description: Page size
      - name: user_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter keys by user ID. Exact match by default; set substring_matching=true (admin only) for case-insensitive substring matching.
          title: User Id
        description: Filter keys by user ID. Exact match by default; set substring_matching=true (admin only) for case-insensitive substring matching.
      - name: team_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter keys by team ID
          title: Team Id
        description: Filter keys by team ID
      - name: organization_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter keys by organization ID
          title: Organization Id
        description: Filter keys by organization ID
      - name: key_hash
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter keys by key hash
          title: Key Hash
        description: Filter keys by key hash
      - name: key_alias
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter keys by key alias. Exact match by default; set substring_matching=true (admin only) for case-insensitive substring matching.
          title: Key Alias
        description: Filter keys by key alias. Exact match by default; set substring_matching=true (admin only) for case-insensitive substring matching.
      - name: return_full_object
        in: query
        required: false
        schema:
          type: boolean
          description: Return full key object
          default: false
          title: Return Full Object
        description: Return full key object
      - name: include_team_keys
        in: query
        required: false
        schema:
          type: boolean
          description: Include all keys for teams that user is an admin of.
          default: false
          title: Include Team Keys
        description: Include all keys for teams that user is an admin of.
      - name: include_created_by_keys
        in: query
        required: false
        schema:
          type: boolean
          description: Include keys created by the user
          default: false
          title: Include Created By Keys
        description: Include keys created by the user
      - name: sort_by
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Column to sort by (e.g. 'user_id', 'created_at', 'spend')
          title: Sort By
        description: Column to sort by (e.g. 'user_id', 'created_at', 'spend')
      - name: sort_order
        in: query
        required: false
        schema:
          type: string
          description: Sort order ('asc' or 'desc')
          default: desc
          title: Sort Order
        description: Sort order ('asc' or 'desc')
      - name: expand
        in: query
        required: false
        schema:
          anyOf:
          - type: array
