openapi: 3.2.0
info:
  title: LiteLLM team management API
  description: 'Enterprise Edition


    Proxy Server to call 100+ LLMs in the OpenAI format. **Customize Swagger Docs**


    👉 ```LiteLLM Admin Panel on /ui```. Create, Edit Keys with SSO. Having issues? Try ```Fallback Login```


    💸 ```LiteLLM Model Cost Map```.


    🔎 ```LiteLLM Model Hub```. See available models on the proxy. **Docs**'
  version: 1.95.0
tags:
- name: Team Management
paths:
  /team/new:
    post:
      tags:
      - Team Management
      summary: New Team
      description: Allow users to create a new team.
      operationId: new_team_team_new_post
      security:
      - APIKeyHeader: []
      parameters:
      - name: litellm-changed-by
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: The litellm-changed-by header enables tracking of actions performed by authorized users on behalf of other users, providing an audit trail for accountability
          title: Litellm-Changed-By
        description: The litellm-changed-by header enables tracking of actions performed by authorized users on behalf of other users, providing an audit trail for accountability
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewTeamRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiteLLM_TeamTable'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /team/update:
    post:
      tags:
      - Team Management
      summary: Update Team
      description: 'Use `/team/member_add` AND `/team/member/delete` to add/remove new team members


        You can now update team budget / rate limits via /team/update


        Parameters:

        - team_id: str - The team id of the user.'
      operationId: update_team_team_update_post
      security:
      - APIKeyHeader: []
      parameters:
      - name: litellm-changed-by
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: The litellm-changed-by header enables tracking of actions performed by authorized users on behalf of other users, providing an audit trail for accountability
          title: Litellm-Changed-By
        description: The litellm-changed-by header enables tracking of actions performed by authorized users on behalf of other users, providing an audit trail for accountability
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTeamRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /team/{team_id}:
    patch:
      tags:
      - Team Management
      summary: Patch Team
      description: 'Partially update a team using RFC 7386 JSON Merge Patch semantics.


        `team_id` is taken from the path; a `team_id` in the body is accepted only when it

        matches. `metadata` is merged with the team''s stored metadata rather than replacing

        it: an omitted key is preserved, `key: null` deletes it, and any other value

        overwrites (recursing into nested objects). Every other field behaves exactly like

        `POST /team/update` (omitted preserves, a value overwrites). Returns the full

        updated team.


        ```

        curl --location --request PATCH ''http://0.0.0.0:4000/team/8d916b1c-510d-4894-a334-1c16a93344f5'' --header ''Authorization: Bearer sk-1234'' --header ''Content-Type: application/json'' --data-raw ''{

        "metadata": {"cost_center": "1234", "deprecated_key": null}

        }''

        ```'
      operationId: patch_team_team__team_id__patch
      security:
      - APIKeyHeader: []
      parameters:
      - name: team_id
        in: path
        required: true
        schema:
          type: string
          title: Team Id
      - name: litellm-changed-by
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: The litellm-changed-by header enables tracking of actions performed by authorized users on behalf of other users, providing an audit trail for accountability
          title: Litellm-Changed-By
        description: The litellm-changed-by header enables tracking of actions performed by authorized users on behalf of other users, providing an audit trail for accountability
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchTeamRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiteLLM_TeamTable'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /team/member_add:
    post:
      tags:
      - Team Management
      summary: Team Member Add
      description: 'Add new members (either via user_email or user_id) to a team


        If user doesn''t exist, new user row will also be added to User Table


        Only proxy_admin or admin of team, allowed to access this endpoint.

        ```


        curl -X POST ''http://0.0.0.0:4000/team/member_add'' -H ''Authorization: Bearer sk-1234'' -H ''Content-Type: application/json'' -d ''{"team_id": "45e3e396-ee08-4a61-a88e-16b3ce7e0849", "member": {"role": "user", "user_id": "krrish247652@berri.ai"}}''


        ```'
      operationId: team_member_add_team_member_add_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamMemberAddRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamAddMemberResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - APIKeyHeader: []
  /team/member_delete:
    post:
      tags:
      - Team Management
      summary: Team Member Delete
      description: '[BETA]


        delete members (either via user_email or user_id) from a team


        If user doesn''t exist, an exception will be raised

        ```

        curl -X POST ''http://0.0.0.0:8000/team/member_delete''

        -H ''Authorization: Bearer sk-1234''

        -H ''Content-Type: application/json''

        -d ''{

        "team_id": "45e3e396-ee08-4a61-a88e-16b3ce7e0849",

        "user_id": "krrish247652@berri.ai"

        }''

        ```'
      operationId: team_member_delete_team_member_delete_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamMemberDeleteRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - APIKeyHeader: []
  /team/member_update:
    post:
      tags:
      - Team Management
      summary: Team Member Update
      description: '[BETA]


        Update team member budgets and team member role'
      operationId: team_member_update_team_member_update_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamMemberUpdateRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamMemberUpdateResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - APIKeyHeader: []
  /team/bulk_member_add:
    post:
      tags:
      - Team Management
      summary: Bulk Team Member Add
      description: 'Bulk add multiple members to a team at once.


        This endpoint reuses the same logic as /team/member_add but provides a bulk-friendly response format.


        Parameters:

        - team_id: str - The ID of the team to add members to

        - members: List[Member] - List of members to add to the team

        - all_users: Optional[bool] - Flag to add all users on Proxy to the team

        - max_budget_in_team: Optional[float] - Maximum budget allocated to each user within the team


        Returns:

        - results: List of individual member addition results

        - total_requested: Total number of members requested for addition

        - successful_additions: Number of successful additions

        - failed_additions: Number of failed additions

        - updated_team: The updated team object


        Example request:

        ```bash

        curl --location ''http://0.0.0.0:4000/team/bulk_member_add'' --header ''Authorization: Bearer sk-1234'' --header ''Content-Type: application/json'' --data ''{

        "team_id": "team-1234",

        "members": [

        {

        "user_id": "user1",

        "role": "user"

        },

        {

        "user_email": "user2@example.com",

        "role": "admin"

        }

        ],

        "max_budget_in_team": 100.0

        }''

        ```'
      operationId: bulk_team_member_add_team_bulk_member_add_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkTeamMemberAddRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkTeamMemberAddResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - APIKeyHeader: []
  /team/delete:
    post:
      tags:
      - Team Management
      summary: Delete Team
      description: 'delete team and associated team keys


        Parameters:

        - team_ids: List[str] - Required. List of team IDs to delete. Example: ["team-1234", "team-5678"]


        ```

        curl --location ''http://0.0.0.0:4000/team/delete'' --header ''Authorization: Bearer sk-1234'' --header ''Content-Type: application/json'' --data-raw ''{

        "team_ids": ["8d916b1c-510d-4894-a334-1c16a93344f5"]

        }''

        ```'
      operationId: delete_team_team_delete_post
      security:
      - APIKeyHeader: []
      parameters:
      - name: litellm-changed-by
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: The litellm-changed-by header enables tracking of actions performed by authorized users on behalf of other users, providing an audit trail for accountability
          title: Litellm-Changed-By
        description: The litellm-changed-by header enables tracking of actions performed by authorized users on behalf of other users, providing an audit trail for accountability
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteTeamRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /team/info:
    get:
      tags:
      - Team Management
      summary: Team Info
      description: 'get info on team + related keys


        Parameters:

        - team_id: str - Required. The unique identifier of the team to get info on.


        ```

        curl --location ''http://localhost:4000/team/info?team_id=your_team_id_here'' --header ''Authorization: Bearer your_api_key_here''

        ```'
      operationId: team_info_team_info_get
      security:
      - APIKeyHeader: []
      parameters:
      - name: team_id
        in: query
        required: false
        schema:
          type: string
          description: Team ID in the request parameters
          title: Team Id
        description: Team ID in the request parameters
      - name: key_limit
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            exclusiveMinimum: 0
          - type: 'null'
          description: Limit the number of keys returned
          title: Key Limit
        description: Limit the number of keys returned
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /team/{team_id}/members/me:
    get:
      tags:
      - Team Management
      summary: Team Member Me
      description: 'Get the caller''s own team-membership row for the given team.


        Used by internal users to view their own spend, budget, budget reset

        date, rate limits, and role within a team — without exposing other

        members'' data. The caller is resolved from their API key; the path

        `/members/me` always refers to that caller.


        Returns 404 if the caller is not a member of the team.


        ```

        curl --location ''http://localhost:4000/team/your_team_id/members/me'' --header ''Authorization: Bearer your_api_key_here''

        ```'
      operationId: team_member_me_team__team_id__members_me_get
      security:
      - APIKeyHeader: []
      parameters:
      - name: team_id
        in: path
        required: true
        schema:
          type: string
          title: Team Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamMemberInfoResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /team/block:
    post:
      tags:
      - Team Management
      summary: Block Team
      description: 'Blocks all calls from keys with this team id.


        Parameters:

        - team_id: str - Required. The unique identifier of the team to block.


        Example:

        ```

        curl --location ''http://0.0.0.0:4000/team/block'' --header ''Authorization: Bearer sk-1234'' --header ''Content-Type: application/json'' --data ''{

        "team_id": "team-1234"

        }''

        ```


        Returns:

        - The updated team record with blocked=True'
      operationId: block_team_team_block_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlockTeamRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - APIKeyHeader: []
  /team/unblock:
    post:
      tags:
      - Team Management
      summary: Unblock Team
      description: 'Unblocks a previously blocked team, re-enabling calls from keys with this team id.


        Parameters:

        - team_id: str - Required. The unique identifier of the team to unblock.


        Example:

        ```

        curl --location ''http://0.0.0.0:4000/team/unblock'' --header ''Authorization: Bearer sk-1234'' --header ''Content-Type: application/json'' --data ''{

        "team_id": "team-1234"

        }''

        ```'
      operationId: unblock_team_team_unblock_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlockTeamRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - APIKeyHeader: []
  /v2/team/list:
    get:
      tags:
      - Team Management
      summary: List Team V2
      description: 'Get a paginated list of teams with filtering and sorting options.


        Parameters:

        user_id: Optional[str]

        Only return teams which this user belongs to

        organization_id: Optional[str]

        Only return teams which belong to this organization

        team_id: Optional[str]

        Filter teams by exact team_id match

        team_alias: Optional[str]

        Filter teams by partial team_alias match

        page: int

        The page number to return

        page_size: int

        The number of items per page

        sort_by: Optional[str]

        Column to sort by (e.g. ''team_id'', ''team_alias'', ''created_at'')

        sort_order: str

        Sort order (''asc'' or ''desc'')

        status: Optional[str]

        Filter by status. Currently supports "deleted" to query deleted teams.'
      operationId: list_team_v2_v2_team_list_get
      security:
      - APIKeyHeader: []
      parameters:
      - name: user_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Only return teams which this 'user_id' belongs to
          title: User Id
        description: Only return teams which this 'user_id' belongs to
      - name: organization_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Only return teams which this 'organization_id' belongs to
          title: Organization Id
        description: Only return teams which this 'organization_id' belongs to
      - name: team_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Only return teams which this 'team_id' belongs to
          title: Team Id
        description: Only return teams which this 'team_id' belongs to
      - name: team_alias
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Only return teams which this 'team_alias' belongs to. Supports partial matching.
          title: Team Alias
        description: Only return teams which this 'team_alias' belongs to. Supports partial matching.
      - name: search
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 'Combined search: matches teams whose ''team_id'' equals the value OR whose ''team_alias'' contains it (case-insensitive).'
          title: Search
        description: 'Combined search: matches teams whose ''team_id'' equals the value OR whose ''team_alias'' contains it (case-insensitive).'
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          description: Page number for pagination
          default: 1
          title: Page
        description: Page number for pagination
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: Number of teams per page
          default: 10
          title: Page Size
        description: Number of teams per page
      - name: sort_by
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Column to sort by (e.g. 'team_id', 'team_alias', 'created_at')
          title: Sort By
        description: Column to sort by (e.g. 'team_id', 'team_alias', 'created_at')
      - name: sort_order
        in: query
        required: false
        schema:
          type: string
          description: Sort order ('asc' or 'desc')
          default: asc
          title: Sort Order
        description: Sort order ('asc' or 'desc')
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by status (e.g. 'deleted')
          title: Status
        description: Filter by status (e.g. 'deleted')
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /team/list:
    get:
      tags:
      - Team Management
      summary: List Team
      description: '```

        curl --location --request GET ''http://0.0.0.0:4000/team/list'' --header ''Authorization: Bearer sk-1234''

        ```


        Parameters:

        - user_id: str - Optional. If passed will only return teams that the user_id is a member of.

        - organization_id: str - Optional. If passed will only return teams that belong to the organization_id. Pass ''default_organization'' to get all teams without organization_id.'
      operationId: list_team_team_list_get
      security:
      - APIKeyHeader: []
      parameters:
      - name: user_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Only return teams which this 'user_id' belongs to
          title: User Id
        description: Only return teams which this 'user_id' belongs to
      - name: organization_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Organization Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /team/model/add:
    post:
      tags:
      - Team Management
      summary: Team Model Add
      description: 'Add models to a team''s allowed model list. Only proxy admin or team admin can add models.


        Parameters:

        - team_id: str - Required. The team to add models to

        - models: List[str] - Required. List of models to add to the team


        Example Request:

        ```

        curl --location ''http://0.0.0.0:4000/team/model/add'' --header ''Authorization: Bearer sk-1234'' --header ''Content-Type: application/json'' --data ''{

        "team_id": "team-1234",

        "models": ["gpt-4", "claude-2"]

        }''

        ```'
      operationId: team_model_add_team_model_add_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamModelAddRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - APIKeyHeader: []
  /team/model/delete:
    post:
      tags:
      - Team Management
      summary: Team Model Delete
      description: 'Remove models from a team''s allowed model list. Only proxy admin or team admin can remove models.


        Parameters:

        - team_id: str - Required. The team to remove models from

        - models: List[str] - Required. List of models to remove from the team


        Example Request:

        ```

        curl --location ''http://0.0.0.0:4000/team/model/delete'' --header ''Authorization: Bearer sk-1234'' --header ''Content-Type: application/json'' --data ''{

        "team_id": "team-1234",

        "models": ["gpt-4"]

        }''

        ```'
      operationId: team_model_delete_team_model_delete_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamModelDeleteRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - APIKeyHeader: []
  /team/permissions_list:
    get:
      tags:
      - Team Management
      summary: Team Member Permissions
      description: Get the team member permissions for a team
      operationId: team_member_permissions_team_permissions_list_get
      security:
      - APIKeyHeader: []
      parameters:
      - name: team_id
        in: query
        required: false
        schema:
          type: string
          description: Team ID in the request parameters
          title: Team Id
        description: Team ID in the request parameters
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetTeamMemberPermissionsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /team/permissions_update:
    post:
      tags:
      - Team Management
      summary: Update Team Member Permissions
      description: Update the team member permissions for a team
      operationId: update_team_member_permissions_team_permissions_update_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTeamMemberPermissionsRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiteLLM_TeamTable'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - APIKeyHeader: []
  /team/permissions_bulk_update:
    post:
      tags:
      - Team Management
      summary: Bulk Update Team Member Permissions
      description: 'Append permissions to existing teams.


        Either pass team_ids to target specific teams, or set

        apply_to_all_teams=True to update every team. For each team,

        the provided permissions are merged with the team''s existing

        permissions (duplicates are skipped).'
