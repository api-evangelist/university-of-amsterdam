- aid: university-of-amsterdam:datanose
  name: DataNose API
  description: >-
    DataNose is the course, registration, timetable and thesis-administration system used by the
    University of Amsterdam's Faculty of Science. Its API host resolves into UVANET1, the
    university's own RIPE allocation, and its Swagger UI answers 200 — but the Swashbuckle
    discovery document it points at, /swagger/docs/v1, returns 500, so the machine-readable
    description of a genuinely institution-run course surface is currently broken. Recorded because
    it is real and institution-operated, and because the broken descriptor is the finding.
