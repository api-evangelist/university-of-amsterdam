x-coverage:
  state: covered
  reason: institution_operated_contract
  detail: >-
    Three institution-operated surfaces were found and verified: the UvA/HvA AI gateway at
    llmproxy.uva.nl, which serves a complete OpenAPI 3.1 document and is the only institution-owned
    contract in this profile; the SAML 2.0 identity provider at login.uva.nl, registered in
    SURFconext and eduGAIN; and the DataNose course API on the university's own network, whose
    Swagger UI answers but whose generated description returns 500. Six further surfaces are real
    but are tenancies on vendor platforms — TriplyDB, Elsevier Pure, LYRASIS ArchivesSpace, Ex Libris
    Alma, Figshare and Eveoh MyTimetable — and are recorded as relationships rather than as UvA
    contracts. The previous profile credited the institution with fourteen tag-split copies of
    Triply's OpenAPI and with the generic api.figshare.com host that nineteen other institutions in
    this catalog also claim; both have been removed. No central developer portal, no public key
    issuance and no self-serve onboarding exist, and the profile says so.
