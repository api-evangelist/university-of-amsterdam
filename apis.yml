- aid: university-of-amsterdam:identity-federation
  name: UvA Identity Provider (SAML 2.0 / SURFconext)
  description: >-
    The university's own SAML 2.0 identity provider, entity ID http://login.uva.nl/adfs/services/trust.
    Signed federation metadata is served from the institution's own host and the entity is registered
    in SURFconext, the Dutch national identity federation, which participates in eduGAIN. Identity federation
    is one of the few machine-readable surfaces a university operates by definition rather than by procurement,
    and it is almost never catalogued.
  humanURL: https://metadata.surfconext.nl/
  baseURL: https://login.uva.nl/federationmetadata/2007-06/federationmetadata.xml
  tags:
