- aid: university-of-amsterdam:oai-catalogue
  name: UvA Central Catalogue OAI-PMH (Ex Libris Alma tenancy)
  description: >-
    The harvesting endpoint the university library documents for its central catalogue — roughly
    2.5 million bibliographic records in MARC-XML and unqualified Dublin Core. It runs on the
    library's Ex Libris Alma tenancy and, as of 2026-08-19, returns HTTP 403 with Alma error code 21
    ("Unauthorized access to the OAI services") to both scripted and browser user agents. The host
    is live; the documented public service is not. Bulk dumps of the same records remain downloadable
    from the library's own server, so the data is still open even though the interface is closed.
  humanURL: https://uba.uva.nl/en/support/open-data/data-sets-and-publication-channels/data-sets-and-publication-channels.html
  baseURL: https://uva.alma.exlibrisgroup.com/view/oai/31UKB_UAM1_INST/request
