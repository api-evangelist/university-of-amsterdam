- aid: university-of-amsterdam:research-data-figshare
  name: UvA/HvA Research Data Repository (Figshare tenancy)
  description: >-
    The shared research data repository of the University of Amsterdam and the Amsterdam University of
    Applied Sciences, running on Figshare at uvaauas.figshare.com. DOIs are minted under the institution's
    own DataCite prefix 10.21942 — 3,238 DOIs registered, publisher recorded at DataCite as "University
    of Amsterdam / Amsterdam University of Applied Sciences". The previous profile of this institution
    recorded the generic api.figshare.com host as a UvA API; nineteen other institutions in this catalog
    claim the same host. It is Figshare's contract, and it is recorded here as a tenancy instead.
