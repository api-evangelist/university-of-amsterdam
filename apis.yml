apis:
- aid: university-of-amsterdam:llm-gateway
  name: UvA/HvA AI Gateway
  description: >-
    The shared AI gateway the University of Amsterdam and the Amsterdam University of Applied
    Sciences run for their students, staff and developers. It fronts GPT, Claude and open-weight
    models behind one institution-issued key on an OpenAI-compatible surface, and it serves a
    complete OpenAPI 3.1 description at /openapi.json — 530 paths, 723 operations. The software is
    LiteLLM, but the deployment sits on the institution's own Azure estate under uva.nl, the key
    issuance is the institution's, and the setup guides are published by the institution's own
    GitHub organisation. This is the one contract in this profile that describes something the
    University of Amsterdam actually operates.
  humanURL: https://github.com/uva/UvA-HvA-Agentic-Tools
  baseURL: https://llmproxy.uva.nl
