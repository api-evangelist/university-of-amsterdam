    host_network: 145.18.0.0/16 UVANET1 (Universiteit van Amsterdam)
- aid: university-of-amsterdam:lod-triply
  name: UvA Library Linked Open Data (TriplyDB tenancy)
  description: >-
    The University of Amsterdam Library publishes its digitised collections — books, letters, maps, images,
    audio, video, sheet music, archaeological objects and the Beeldbank image repository — as linked open
    data under PDDL/ODC-BY, reachable over REST, SPARQL and GraphQL. The data, the UB-UVA account and
    the licensing are the library's. The platform is not: api.lod.uba.uva.nl CNAMEs to uba.cname.triply.cc
    and the OpenAPI served there is titled "TriplyDB API" with info.contact pointing at triply.cc. A single
    vendor contract, split by tag, previously appeared in this profile as fourteen separate University
    of Amsterdam APIs. It is recorded here as one tenant relationship, and the contract is left to score
    against Triply.
  humanURL: https://lod.uba.uva.nl/
  baseURL: https://api.lod.uba.uva.nl/datasets/UB-UVA/
  tags:
  - Open Data
  - Linked Data
  - SPARQL
  - Library
  - Digital Collections
  properties:
