- aid: university-of-amsterdam:timetable
  name: UvA Timetable API (MyTimetable tenancy)
  description: >-
    The university timetable at rooster.uva.nl exposes a JSON API under /api/ that answers 401 with a
    structured error to unauthenticated callers, so the surface is real and gated behind institutional
    sign-in. The host CNAMEs to uva.hosting.eveoh.nl — it is Eveoh's MyTimetable product, not UvA engineering.
    Recorded because a timetable API is one of the classes a university genuinely has, and because it
    is the only one here.
