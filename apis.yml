aid: university-of-amsterdam
name: University of Amsterdam
description: 'The University of Amsterdam (Universiteit van Amsterdam, UvA) is a public research
  university in Amsterdam, Netherlands, a LERU member and one of the two large research universities
  in the city. It operates no central developer portal and issues no public API keys, and the honest
  shape of its programmable footprint is three institution-run surfaces surrounded by six vendor
  platforms it is a tenant of. What it genuinely runs itself: a shared AI gateway with the Amsterdam
  University of Applied Sciences at llmproxy.uva.nl that serves a full OpenAPI 3.1 description and
  issues keys to staff, students and developers on request; a SAML 2.0 identity provider whose signed
  federation metadata is published on its own host and registered in SURFconext and eduGAIN; and the
  DataNose course and registration API on its own network, whose Swagger UI answers but whose
  generated description currently returns 500. Everything else that looks like a UvA API is a
  contract someone else wrote: the library''s Linked Open Data platform is a TriplyDB tenancy, the
  research repository is Figshare, UvA-DARE and its OAI-PMH feed are Elsevier Pure, the archives
  OAI provider is LYRASIS-hosted ArchivesSpace, the central catalogue OAI endpoint is Ex Libris Alma
  and now returns 403 to the public, and the timetable API is Eveoh MyTimetable behind SSO. The data
  in those systems is the university''s; the interfaces are not.'
